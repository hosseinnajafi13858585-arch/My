    var remoteKeys=remote.keys&&typeof remote.keys==='object'?remote.keys:{};
    ownerUsername=String(remote.ownerUsername||legacyOwnerName()||'owner').replace(/[^a-zA-Z0-9_]/g,'').slice(0,32)||'owner';
    var metadata=owner&&owner.user_metadata?owner.user_metadata:{};
    visibleUsername=String(metadata.username||metadata.user_name||(owner.email?owner.email.split('@')[0]:ownerUsername)).replace(/[^a-zA-Z0-9_.-]/g,'').slice(0,32)||ownerUsername;
    displayName=String(metadata.full_name||metadata.name||'').trim();
    var localKeys=safeKeys();
    var merged={};Object.keys(remoteKeys).forEach(function(k){merged[k]=remoteKeys[k];});
    Object.keys(localKeys).forEach(function(k){if(!Object.prototype.hasOwnProperty.call(merged,k))merged[k]=localKeys[k];});
    applyKeys(merged);seedLegacySession();
    var payload={schema:1,ownerUsername:ownerUsername,keys:merged};
    if(!offlineMode){await saveCloud(payload);lastSyncedPayload=payload;lastSignature=JSON.stringify(payload);}else{lastSyncedPayload=remote;lastSignature=JSON.stringify(remote);}
    document.getElementById('account-label').textContent=offlineMode?'حساب شخصی میزان · حالت آفلاین · ذخیره روی دستگاه':'حساب شخصی میزان · همگام‌سازی ابری فعال';installPasskeyRegisterButton();
    gate.classList.add('hidden');workspace.classList.remove('hidden');
    var frame=document.getElementById('appframe');
    frame.onload=function(){lockEmbeddedApp(frame);try{frame.contentWindow.MizanProfile={username:visibleUsername,name:displayName||visibleUsername};}catch(e){}};
    frame.src='index-1.html';
    startSync();
  }
  function lockEmbeddedApp(frame){
    try{
      var w=frame.contentWindow;
      if(w.Auth){
        var oldLogout=w.Auth.logout;
        w.Auth.logout=function(){try{oldLogout.call(w.Auth);}catch(e){}window.postMessage({type:'private-workapp-logout'},location.origin);};
        w.Auth.addUser=function(){return false;};
        w.Auth.signUp=function(){return{ok:false,reason:'single_user'};};
        w.Auth.register=function(){return{ok:false,reason:'single_user'};};
        w.Auth.deleteUser=function(){return false;};
      }
    }catch(e){}
  }
  function startSync(){
    if(syncTimer)clearInterval(syncTimer);
    syncTimer=setInterval(async function(){
      if(!navigator.onLine||busy||!owner||!lastSyncedPayload)return;
      busy=true;
      try{
        var result=await supa().from('app_data').select('payload').eq('user_id',owner.id).maybeSingle();
        if(result.error)throw result.error;
        if(!result.data)throw new Error('رکورد فضای ابری پیدا نشد.');
        var remote=result.data.payload&&typeof result.data.payload==='object'?result.data.payload:{};
        var remoteKeys=remote.keys&&typeof remote.keys==='object'?remote.keys:{};
        var localKeys=safeKeys(),baseKeys=lastSyncedPayload.keys||{},changed=[],all={};
        Object.keys(baseKeys).forEach(function(k){all[k]=true;});
        Object.keys(localKeys).forEach(function(k){all[k]=true;});
        Object.keys(all).forEach(function(k){
          var had=Object.prototype.hasOwnProperty.call(baseKeys,k),has=Object.prototype.hasOwnProperty.call(localKeys,k);
          if(had!==has||(had&&baseKeys[k]!==localKeys[k]))changed.push({key:k,deleted:!has,value:localKeys[k]});
        });
        if(changed.length){
          var merged={};Object.keys(remoteKeys).forEach(function(k){merged[k]=remoteKeys[k];});
          changed.forEach(function(x){if(x.deleted)delete merged[x.key];else merged[x.key]=x.value;});
          var payload={schema:1,ownerUsername:remote.ownerUsername||ownerUsername,keys:merged};
          await saveCloud(payload);
          applyKeys(merged);
          lastSyncedPayload=payload;
          lastSignature=JSON.stringify(payload);
          localStorage.setItem('workapp-cloud-sync-v1','1');
        }else{
          var normalized={schema:1,ownerUsername:remote.ownerUsername||ownerUsername,keys:remoteKeys};
          if(payloadSignature(normalized)!==payloadSignature(lastSyncedPayload)){
            ownerUsername=normalized.ownerUsername;
            applyKeys(remoteKeys);
            seedLegacySession();
            lastSyncedPayload=normalized;
            lastSignature=JSON.stringify(normalized);
          }
        }
      }catch(e){console.warn('Cloud sync failed',e);say('اتصال ابری موقتاً برقرار نیست؛ اطلاعات روی همین دستگاه محفوظ است.');}
      finally{busy=false;}
    },3000);
  }
  window.addEventListener('online',function(){var label=document.getElementById('account-label');if(label&&owner)label.textContent='حساب شخصی میزان · اینترنت وصل شد · همگام‌سازی در حال انجام';});
  window.addEventListener('offline',function(){var label=document.getElementById('account-label');if(label&&owner)label.textContent='حساب شخصی میزان · حالت آفلاین · ذخیره روی دستگاه';});
  async function logout(){document.querySelectorAll('.global-nav').forEach(function(n){n.remove();});if(syncTimer)clearInterval(syncTimer);syncTimer=null;owner=null;try{await supa().auth.signOut();}catch(e){}workspace.classList.add('hidden');gate.classList.remove('hidden');form.reset();setMode('login');say('از حساب خارج شدی.',true);}
  form.addEventListener('submit',async function(e){e.preventDefault();if(busy)return;var email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{if(rememberEmail.checked)localStorage.setItem('mizan-saved-email',email);else localStorage.removeItem('mizan-saved-email');}catch(storageError){}busy=true;submitBtn.disabled=true;say('در حال انجام...');try{if(mode==='forgot'){if(!email)throw new Error('ایمیل را وارد کن.');var fr=await supa().auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(fr.error)throw fr.error;say('اگر این ایمیل ثبت شده باشد، لینک بازیابی برایش ارسال می‌شود.',true);return;}if(mode==='update'){if(password.length<8)throw new Error('رمز جدید باید حداقل ۸ کاراکتر باشد.');var ur=await supa().auth.updateUser({password:password});if(ur.error)throw ur.error;say('رمز عبور با موفقیت تغییر کرد؛ در حال ورود...',true);await prepareWorkspace();return;}if(!email||password.length<8)throw new Error('ایمیل معتبر و رمز حداقل ۸ کاراکتری وارد کن.');if(mode==='signup'){if(await ownerClaimed())throw new Error('حساب مالک قبلاً ساخته شده است؛ از بخش ورود استفاده کن.');var sr=await supa().auth.signUp({email:email,password:password});if(sr.error)throw sr.error;if(!sr.data.session){say('حساب ساخته شد. ایمیلت را تأیید کن؛ سپس از همین صفحه وارد شو.',true);return;}await prepareWorkspace();}else{var lr=await supa().auth.signInWithPassword({email:email,password:password});if(lr.error)throw lr.error;await prepareWorkspace();}}catch(err){if(mode==='login'&&(err.code==='email_not_confirmed'||/email not confirmed/i.test(err.message||'')))resendBtn.classList.remove('hidden');say(err.message||'عملیات انجام نشد.');}finally{busy=false;submitBtn.disabled=false;}});
  resendBtn.addEventListener('click',async function(){var email=emailInput.value.trim();if(!email){say('ابتدا ایمیل را وارد کن.');return;}resendBtn.disabled=true;try{var rr=await supa().auth.resend({type:'signup',email:email});if(rr.error)throw rr.error;say('در صورت امکان، ایمیل تأیید دوباره ارسال شد. صندوق ورودی و پوشه هرزنامه را بررسی کن.',true);}catch(e){say(e.message||'ارسال ایمیل انجام نشد.');}finally{resendBtn.disabled=false;}});
  signupBtn.addEventListener('click',function(){setMode('signup');});
  forgotBtn.addEventListener('click',function(){setMode('forgot');});
  document.getElementById('logout').addEventListener('click',logout);
  window.addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.type==='private-workapp-logout')logout();});
  window.addEventListener('message',async function(e){if(e.origin!==location.origin||!e.data||e.data.type!=='mizan-profile-update')return;var next=String(e.data.name||visibleUsername).trim();if(!next)return;displayName=next;try{var updated=await supa().auth.updateUser({data:{full_name:displayName,username:visibleUsername}});if(updated.error)console.warn('Mizan profile sync failed',updated.error);else if(updated.data&&updated.data.user)owner=updated.data.user;}catch(err){console.warn('Mizan profile sync failed',err);}var label=document.getElementById('account-label');if(label)label.textContent='@'+visibleUsername+' · '+displayName+' · همگام‌سازی ابری فعال';});

  async function boot(){var recoveryFlow=location.hash.indexOf('type=recovery')!==-1;setMode(recoveryFlow?'update':'login');try{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('PWA registration failed',e);});var s=await supa().auth.getSession();if(recoveryFlow){if(!s.data.session)throw new Error('لینک بازیابی معتبر نیست یا منقضی شده است. دوباره درخواست بازیابی بده.');setMode('update');return;}if(s.data.session){await prepareWorkspace();return;}if(await ownerClaimed()){signupBtn.classList.add('hidden');}}catch(e){say(e.message||'اتصال به سرویس امن برقرار نشد.');}}
  supa().auth.onAuthStateChange(function(event,session){if(event==='PASSWORD_RECOVERY'){setMode('update');say('لینک بازیابی تأیید شد؛ رمز جدید را وارد کن.',true);}if(event==='SIGNED_OUT'&&owner){owner=null;if(syncTimer)clearInterval(syncTimer);workspace.classList.add('hidden');gate.classList.remove('hidden');}});
  boot();
})();
</script>
