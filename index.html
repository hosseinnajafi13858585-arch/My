<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="فضای شخصی و امن مدیریت کار و امور مالی">
<title>مدیریت شخصی | ورود امن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Vazirmatn,system-ui,sans-serif;color:#e8eef9;background:#09111f;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,rgba(79,70,229,.19),transparent 35%),radial-gradient(ellipse at 90% 85%,rgba(14,165,233,.13),transparent 32%),#09111f}
button,input{font:inherit}
button{cursor:pointer}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.panel{width:min(100%,430px);padding:32px;border:1px solid rgba(148,163,184,.18);border-radius:26px;background:rgba(15,23,42,.82);box-shadow:0 24px 80px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
.brand{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#818cf8,#22d3ee);font-size:25px;font-weight:800;color:#07111f;margin-bottom:22px}
h1{font-size:22px;margin:0 0 8px}
.sub{color:#9aa9bf;font-size:13px;line-height:1.9;margin:0 0 24px}
.field{margin:14px 0}
label{display:block;font-size:12px;color:#cbd5e1;margin-bottom:7px}
input{width:100%;border:1px solid rgba(148,163,184,.22);background:#0b1526;color:#f8fafc;border-radius:12px;padding:13px 14px;outline:none;direction:ltr;text-align:left}
input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.14)}
.actions{display:grid;gap:9px;margin-top:20px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700}
.primary{background:linear-gradient(135deg,#818cf8,#6366f1);color:white}
.secondary{background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.18);color:#dbeafe}
.link{background:none;border:0;color:#a5b4fc;font-size:12px;padding:8px}
#msg{min-height:24px;margin-top:12px;color:#fbbf24;font-size:12px;line-height:1.8}
.hidden{display:none!important}
#workspace{height:100vh;display:flex;flex-direction:column}
.top{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0b1424;border-bottom:1px solid rgba(148,163,184,.13);font-size:12px;color:#cbd5e1}
.top button{background:rgba(248,113,113,.12);color:#fecaca;border:1px solid rgba(248,113,113,.2);border-radius:9px;padding:6px 12px;font-size:11px}
#appframe{border:0;width:100%;flex:1;min-height:0;background:#f0f4f9}
@media(max-width:520px){#gate{padding:14px}.panel{padding:24px 20px;border-radius:22px}.top{padding:0 10px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="gate">
  <main class="panel">
    <div class="brand">م</div>
    <h1 id="heading">ورود به فضای شخصی</h1>
    <p class="sub" id="description">اطلاعات مدیریت کار و امور مالی فقط برای حساب مالک در دسترس است.</p>
    <form id="auth-form">
      <div class="field"><label for="email">ایمیل</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com" required></div>
      <div class="field"><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور" required minlength="8"></div>
      <div class="actions">
        <button class="btn primary" id="submit" type="submit">ورود امن</button>
        <button class="btn secondary" id="signup" type="button">ساخت حساب مالک (فقط بار اول)</button>
        <button class="link" id="forgot" type="button">فراموشی رمز عبور</button>
      </div>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
  </main>
</div>
<div id="workspace" class="hidden">
  <header class="top"><span id="account-label">فضای شخصی شما · همگام‌سازی ابری فعال</span><button id="logout" type="button">خروج امن</button></header>
  <iframe id="appframe" title="مدیریت کار و امور مالی" referrerpolicy="same-origin"></iframe>
</div>
<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://jrhihuaswonlcdkhoabf.supabase.co';
  var SUPABASE_KEY='sb_publishable_48l_e94YWetezy99KDGqWqU_uGj7sf9i';
  var client=null,owner=null,ownerUsername='owner',syncTimer=null,lastSignature='',lastSyncedPayload=null,busy=false,mode='login';
  var gate=document.getElementById('gate'),workspace=document.getElementById('workspace'),form=document.getElementById('auth-form'),msg=document.getElementById('msg'),signupBtn=document.getElementById('signup'),forgotBtn=document.getElementById('forgot'),submitBtn=document.getElementById('submit');
  function supa(){if(!client){if(!window.supabase)throw new Error('کتابخانه اتصال بارگذاری نشد؛ اینترنت را بررسی کن.');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}return client;}
  function say(s,good){msg.textContent=s||'';msg.style.color=good?'#86efac':'#fbbf24';}
  function setMode(next){mode=next;document.getElementById('heading').textContent=next==='signup'?'ساخت حساب مالک':next==='forgot'?'بازیابی رمز عبور':'ورود به فضای شخصی';document.getElementById('description').textContent=next==='signup'?'این ثبت‌نام فقط برای اولین مالک پروژه فعال است. بعد از ثبت حساب، ساخت حساب جدید بسته می‌شود.':next==='forgot'?'لینک بازیابی رمز به ایمیل مالک ارسال می‌شود.':'اطلاعات مدیریت کار و امور مالی فقط برای حساب مالک در دسترس است.';submitBtn.textContent=next==='signup'?'ساخت حساب و ورود':next==='forgot'?'ارسال لینک بازیابی':'ورود امن';signupBtn.classList.toggle('hidden',next!=='login');forgotBtn.classList.toggle('hidden',next!=='login');document.getElementById('password').classList.toggle('hidden',next==='forgot');document.querySelector('label[for="password"]').classList.toggle('hidden',next==='forgot');document.getElementById('password').required=next!=='forgot';say('');}
  async function ownerClaimed(){var r=await supa().from('app_owner').select('singleton_id').eq('singleton_id',1).maybeSingle();if(r.error)throw r.error;return !!r.data;}
  async function verifyOwner(u){var r=await supa().from('app_owner').select('user_id').eq('user_id',u.id).maybeSingle();if(r.error)throw r.error;return !!r.data;}
  function safeKeys(){var out={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k||k.indexOf('workapp-')!==0)continue;if(['workapp-users','workapp-auth','workapp-super','workapp-cloud-sync-v1','workapp-legacy-auth-backup'].indexOf(k)>=0)continue;if(k.indexOf('workapp-u-')===0&&k.indexOf('workapp-u-'+ownerUsername+'-')!==0)continue;out[k]=localStorage.getItem(k);}return out;}
  function legacyOwnerName(){try{var s=localStorage.getItem('workapp-super');if(s)return s;var u=JSON.parse(localStorage.getItem('workapp-users')||'[]');var a=u.find(function(x){return x.role==='superadmin'||x.isSuper;})||u[0];if(a&&a.username)return a.username;}catch(e){}return 'owner';}
  function applyKeys(keys){var remove=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('workapp-')===0&&['workapp-users','workapp-auth','workapp-super','workapp-cloud-sync-v1','workapp-legacy-auth-backup'].indexOf(k)<0)remove.push(k);}remove.forEach(function(k){localStorage.removeItem(k);});Object.keys(keys||{}).forEach(function(k){if(k.indexOf('workapp-')===0&&typeof keys[k]==='string')localStorage.setItem(k,keys[k]);});}
  function seedLegacySession(){
    var bytes=new Uint8Array(18);crypto.getRandomValues(bytes);var internalPassword=Array.from(bytes).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
    var account={username:ownerUsername,password:internalPassword,name:ownerUsername,role:'superadmin',status:'active',approval:'approved',permissions:[],isSuper:true,createdAt:new Date().toISOString()};
    localStorage.setItem('workapp-users',JSON.stringify([account]));localStorage.setItem('workapp-super',ownerUsername);
    sessionStorage.setItem('workapp-auth',JSON.stringify({username:ownerUsername,name:ownerUsername,role:'superadmin',isSuper:true}));
  }
  function payloadSignature(p){var keys=p&&p.keys&&typeof p.keys==='object'?p.keys:{},sorted={};Object.keys(keys).sort().forEach(function(k){sorted[k]=keys[k];});return JSON.stringify({schema:1,ownerUsername:(p&&p.ownerUsername)||'owner',keys:sorted});}
  async function saveCloud(payload){var r=await supa().from('app_data').upsert({user_id:owner.id,payload:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(r.error)throw r.error;}
  async function prepareWorkspace(){
    owner=(await supa().auth.getSession()).data.session.user;
    if(!await verifyOwner(owner)){await supa().auth.signOut();throw new Error('این حساب مالک این برنامه نیست و اجازه ورود ندارد.');}
    var r=await supa().from('app_data').select('payload').eq('user_id',owner.id).maybeSingle();if(r.error)throw r.error;
    var remote=r.data&&r.data.payload&&typeof r.data.payload==='object'?r.data.payload:{};
    var remoteKeys=remote.keys&&typeof remote.keys==='object'?remote.keys:{};
    ownerUsername=String(remote.ownerUsername||legacyOwnerName()||'owner').replace(/[^a-zA-Z0-9_]/g,'').slice(0,32)||'owner';
    var localKeys=safeKeys();
    var merged={};Object.keys(remoteKeys).forEach(function(k){merged[k]=remoteKeys[k];});
    Object.keys(localKeys).forEach(function(k){if(!Object.prototype.hasOwnProperty.call(merged,k))merged[k]=localKeys[k];});
    applyKeys(merged);seedLegacySession();
    var payload={schema:1,ownerUsername:ownerUsername,keys:merged};
    await saveCloud(payload);lastSyncedPayload=payload;lastSignature=JSON.stringify(payload);
    document.getElementById('account-label').textContent='حساب مالک: '+owner.email+' · همگام‌سازی ابری فعال';
    gate.classList.add('hidden');workspace.classList.remove('hidden');
    var frame=document.getElementById('appframe');
    frame.onload=function(){lockEmbeddedApp(frame);};
    frame.src='index-1.html';
    startSync();
  }
  function lockEmbeddedApp(frame){
    try{
      var w=frame.contentWindow;
      if(w.Auth){
        var oldLogout=w.Auth.logout;
        w.Auth.logout=function(){try{oldLogout.call(w.Auth);}catch(e){}window.postMessage({type:'private-workapp-logout'},location.origin);};
        w.Auth.addUser=function(){return false;};
        w.Auth.signUp=function(){return{ok:false,reason:'single_user'};};
        w.Auth.register=function(){return{ok:false,reason:'single_user'};};
        w.Auth.deleteUser=function(){return false;};
      }
    }catch(e){}
  }
  function startSync(){
    if(syncTimer)clearInterval(syncTimer);
    syncTimer=setInterval(async function(){
      if(busy||!owner||!lastSyncedPayload)return;
      busy=true;
      try{
        var result=await supa().from('app_data').select('payload').eq('user_id',owner.id).maybeSingle();
        if(result.error)throw result.error;
        if(!result.data)throw new Error('رکورد فضای ابری پیدا نشد.');
        var remote=result.data.payload&&typeof result.data.payload==='object'?result.data.payload:{};
        var remoteKeys=remote.keys&&typeof remote.keys==='object'?remote.keys:{};
        var localKeys=safeKeys(),baseKeys=lastSyncedPayload.keys||{},changed=[],all={};
        Object.keys(baseKeys).forEach(function(k){all[k]=true;});
        Object.keys(localKeys).forEach(function(k){all[k]=true;});
        Object.keys(all).forEach(function(k){
          var had=Object.prototype.hasOwnProperty.call(baseKeys,k),has=Object.prototype.hasOwnProperty.call(localKeys,k);
          if(had!==has||(had&&baseKeys[k]!==localKeys[k]))changed.push({key:k,deleted:!has,value:localKeys[k]});
        });
        if(changed.length){
          var merged={};Object.keys(remoteKeys).forEach(function(k){merged[k]=remoteKeys[k];});
          changed.forEach(function(x){if(x.deleted)delete merged[x.key];else merged[x.key]=x.value;});
          var payload={schema:1,ownerUsername:remote.ownerUsername||ownerUsername,keys:merged};
          await saveCloud(payload);
          applyKeys(merged);
          lastSyncedPayload=payload;
          lastSignature=JSON.stringify(payload);
          localStorage.setItem('workapp-cloud-sync-v1','1');
        }else{
          var normalized={schema:1,ownerUsername:remote.ownerUsername||ownerUsername,keys:remoteKeys};
          if(payloadSignature(normalized)!==payloadSignature(lastSyncedPayload)){
            ownerUsername=normalized.ownerUsername;
            applyKeys(remoteKeys);
            seedLegacySession();
            lastSyncedPayload=normalized;
            lastSignature=JSON.stringify(normalized);
          }
        }
      }catch(e){console.warn('Cloud sync failed',e);say('اتصال ابری موقتاً برقرار نیست؛ اطلاعات روی همین دستگاه محفوظ است.');}
      finally{busy=false;}
    },3000);
  }
  async function logout(){if(syncTimer)clearInterval(syncTimer);syncTimer=null;owner=null;try{await supa().auth.signOut();}catch(e){}workspace.classList.add('hidden');gate.classList.remove('hidden');form.reset();setMode('login');say('از حساب خارج شدی.',true);}
  form.addEventListener('submit',async function(e){e.preventDefault();if(busy)return;var email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;busy=true;submitBtn.disabled=true;say('در حال انجام...');try{if(mode==='forgot'){if(!email)throw new Error('ایمیل را وارد کن.');var fr=await supa().auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(fr.error)throw fr.error;say('اگر این ایمیل ثبت شده باشد، لینک بازیابی برایش ارسال می‌شود.',true);return;}if(!email||password.length<8)throw new Error('ایمیل معتبر و رمز حداقل ۸ کاراکتری وارد کن.');if(mode==='signup'){if(await ownerClaimed())throw new Error('حساب مالک قبلاً ساخته شده است؛ از بخش ورود استفاده کن.');var sr=await supa().auth.signUp({email:email,password:password});if(sr.error)throw sr.error;if(!sr.data.session){say('حساب ساخته شد. ایمیلت را تأیید کن؛ سپس از همین صفحه وارد شو.',true);return;}await prepareWorkspace();}else{var lr=await supa().auth.signInWithPassword({email:email,password:password});if(lr.error)throw lr.error;await prepareWorkspace();}}catch(err){say(err.message||'عملیات انجام نشد.');}finally{busy=false;submitBtn.disabled=false;}});
  signupBtn.addEventListener('click',function(){setMode('signup');});
  forgotBtn.addEventListener('click',function(){setMode('forgot');});
  document.getElementById('logout').addEventListener('click',logout);
  window.addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.type==='private-workapp-logout')logout();});
  async function boot(){setMode('login');try{var s=await supa().auth.getSession();if(s.data.session){await prepareWorkspace();return;}if(await ownerClaimed()){signupBtn.classList.add('hidden');}}catch(e){say(e.message||'اتصال به سرویس امن برقرار نشد.');}}
  supa().auth.onAuthStateChange(function(event,session){if(event==='SIGNED_OUT'&&owner){owner=null;if(syncTimer)clearInterval(syncTimer);workspace.classList.add('hidden');gate.classList.remove('hidden');}});
  boot();
})();
</script>
</body>
</html>
