      var accs=RememberedAccounts.getAll();
      var card=document.createElement('div');card.className='auth-card';
      card.innerHTML='<div class="auth-logo">'+AUTH_LOGO+'</div><h1 class="auth-h">ورود به حساب</h1><p class="auth-sub">مدیریت کار — سیستم جامع کارکنان</p>'+'<div class="afield"><label for="lf-u">نام کاربری</label><div class="af-in"><span class="af-lico">'+Icons.user+'</span><input type="text" id="lf-u" autocomplete="username" placeholder="نام کاربری" value="'+(prefill?escH(prefill):'')+'"></div></div>'+'<div class="afield"><label for="lf-p">رمز عبور</label><div class="af-in"><span class="af-lico">'+Icons.lock+'</span><input type="password" id="lf-p" autocomplete="current-password" placeholder="رمز عبور"></div></div>'+'<label class="auth-remember"><input type="checkbox" id="lf-rem" checked><span>مرا به خاطر بسپار</span></label>'+'<div class="aerr" id="lf-err"></div>'+'<button class="auth-btn" id="lf-btn" >'+Icons.lock+'<span>ورود</span></button>'+'<div class="auth-links">'+(accs.length?'<button class="alink" id="lf-backacc">← حساب‌های من</button>':'<button class="alink" id="lf-signup">ثبت‌نام</button>')+'<span class="alink-div"></span><button class="alink hi" id="lf-forgot">فراموشی رمز</button></div>';
      wrap.appendChild(card);
      var uEl=card.querySelector('#lf-u'),pEl=card.querySelector('#lf-p'),errEl=card.querySelector('#lf-err'),btnEl=card.querySelector('#lf-btn');
      var eyeBtn=document.createElement('button');eyeBtn.className='af-eye';eyeBtn.type='button';eyeBtn.innerHTML=Icons.eye;eyeBtn.addEventListener('click',function(){if(pEl)pEl.type=pEl.type==='password'?'text':'password';eyeBtn.innerHTML=pEl.type==='password'?Icons.eye:Icons.eyeOff;});
      if(pEl&&pEl.parentNode)pEl.parentNode.appendChild(eyeBtn);
      if(prefill&&pEl)pEl.focus();else if(uEl)uEl.focus();
      function doLogin(){
        var u=(uEl?uEl.value:'').trim(),p=(pEl?pEl.value:'');
        clearAErr(errEl);
        if(!u){showAErr(errEl,'نام کاربری را وارد کنید');if(uEl)uEl.focus();return;}
        if(!p){showAErr(errEl,'رمز عبور را وارد کنید');if(pEl)pEl.focus();return;}
        setBtnLoading(btnEl,true);
        setTimeout(function(){
          var res=Auth.login(u,p);
          setBtnLoading(btnEl,false);
          if(res.ok){
            var remEl=card.querySelector('#lf-rem');
            if(remEl&&remEl.checked)RememberedAccounts.remember(u,Auth.getUser()?Auth.getUser().name:u,new Date().toISOString());
            handleLoginSuccess(u);
          }else{handleLoginFail(errEl,card,res.reason);}
        },110);
      }
      if(btnEl)btnEl.addEventListener('click',doLogin);
      if(pEl)pEl.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
      if(uEl)uEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&pEl)pEl.focus();});
      var backaccBtn=card.querySelector('#lf-backacc');
      if(backaccBtn)backaccBtn.addEventListener('click',function(){_renderAccounts(wrap,RememberedAccounts.getAll());});
      var signupBtn=card.querySelector('#lf-signup');
      if(signupBtn)signupBtn.addEventListener('click',function(){_renderSignUp(wrap);});
      var forgotBtn=card.querySelector('#lf-forgot');
      if(forgotBtn)forgotBtn.addEventListener('click',function(){_renderForgot(wrap);});
      card.addEventListener('keydown',function(e){if(e.key==='Escape'&&accs.length){_renderAccounts(wrap,accs);}});
    });
  }
  function _renderSignUp(wrap){
    authTransition(wrap,function(){
      var card=document.createElement('div');card.className='auth-card';
      card.innerHTML='<div class="auth-logo" style="background:linear-gradient(135deg,rgba(16,185,129,.42),rgba(8,145,178,.3))">'+AUTH_LOGO+'</div><h1 class="auth-h">ثبت‌نام</h1><p class="auth-sub">پس از ثبت‌نام، حساب شما نیاز به تأیید مدیر دارد</p>'+'<div class="afield"><label for="su-n">نام کامل</label><div class="af-in"><span class="af-lico">'+Icons.user+'</span><input type="text" id="su-n" autocomplete="name" placeholder="نام و نام خانوادگی"></div></div>'+'<div class="afield"><label for="su-u">نام کاربری</label><div class="af-in"><span class="af-lico">'+Icons.user+'</span><input type="text" id="su-u" autocomplete="username" placeholder="فقط حروف انگلیسی، عدد و _"></div></div>'+'<div class="afield"><label for="su-p">رمز عبور</label><div class="af-in"><span class="af-lico">'+Icons.lock+'</span><input type="password" id="su-p" autocomplete="new-password" placeholder="حداقل ۴ کاراکتر"></div></div>'+'<div class="afield"><label for="su-r">تکرار رمز</label><div class="af-in"><span class="af-lico">'+Icons.lock+'</span><input type="password" id="su-r" autocomplete="new-password" placeholder="رمز را تکرار کنید"></div></div>'+'<div class="aerr" id="su-err"></div>'+'<button class="auth-btn" id="su-btn">'+Icons.userPlus+'<span>ثبت‌نام</span></button>'+'<div class="auth-links"><button class="alink" id="su-back">← ورود به حساب</button></div>';
      wrap.appendChild(card);
      var nEl=card.querySelector('#su-n'),uEl=card.querySelector('#su-u'),pEl=card.querySelector('#su-p'),rEl=card.querySelector('#su-r'),errEl=card.querySelector('#su-err'),btnEl=card.querySelector('#su-btn');
      if(nEl)nEl.focus();
      if(btnEl)btnEl.addEventListener('click',function(){
        var name=(nEl?nEl.value:'').trim(),u=(uEl?uEl.value:'').trim(),p=(pEl?pEl.value:''),r=(rEl?rEl.value:'');
        clearAErr(errEl);
        if(!u||!p){showAErr(errEl,'نام کاربری و رمز الزامی است');return;}
        if(p!==r){showAErr(errEl,'رمزها یکسان نیستند');return;}
        if(p.length<4){showAErr(errEl,'رمز باید حداقل ۴ کاراکتر باشد');return;}
        if(!/^[a-zA-Z0-9_]+$/.test(u)){showAErr(errEl,'نام کاربری فقط حروف انگلیسی، عدد و _ مجاز است');return;}
        var res=Auth.signUp(u,p,name);
        if(!res.ok){showAErr(errEl,'این نام کاربری قبلاً ثبت شده');return;}
        try{AuditLog.append('درخواست ثبت‌نام',u,'','');}catch(e){}
        _renderSignUpOK(wrap,u);
      });
      var backBtn=card.querySelector('#su-back');
      if(backBtn)backBtn.addEventListener('click',function(){_renderLogin(wrap);});
    });
  }
  function _renderSignUpOK(wrap,username){
    authTransition(wrap,function(){
      var card=document.createElement('div');card.className='auth-card';card.style.textAlign='center';
      card.innerHTML='<div class="auth-logo" style="background:linear-gradient(135deg,rgba(16,185,129,.5),rgba(8,145,178,.35));margin-bottom:22px">'+AUTH_LOGO+'</div><h1 class="auth-h" style="margin-bottom:10px">ثبت‌نام موفق!</h1><p style="color:rgba(255,255,255,.62);font-size:13px;line-height:1.8;margin-bottom:22px">حساب کاربری شما با موفقیت ایجاد شد.<br>در انتظار تأیید مدیر سیستم باشید.<br>پس از تأیید می‌توانید وارد شوید.</p><button class="auth-btn" id="sukbk">'+Icons.chevR+'<span>بازگشت به ورود</span></button>';
      wrap.appendChild(card);
      var bk=card.querySelector('#sukbk');if(bk)bk.addEventListener('click',function(){_renderLogin(wrap);});
    });
  }
  function _renderForgot(wrap){
    authTransition(wrap,function(){
      var card=document.createElement('div');card.className='auth-card';
      card.innerHTML='<div class="auth-logo" style="background:linear-gradient(135deg,rgba(245,158,11,.4),rgba(239,68,68,.25))">'+AUTH_LOGO+'</div><h1 class="auth-h">فراموشی رمز</h1><p class="auth-sub">نام کاربری خود را وارد کنید</p>'+'<div class="afield"><label for="fp-u">نام کاربری</label><div class="af-in"><span class="af-lico">'+Icons.user+'</span><input type="text" id="fp-u" placeholder="نام کاربری"></div></div>'+'<div class="aerr" id="fp-err"></div>'+'<button class="auth-btn" id="fp-btn">'+Icons.search+'<span>بررسی</span></button>'+'<div class="auth-links"><button class="alink" id="fp-back">← بازگشت به ورود</button></div>';
      wrap.appendChild(card);
      var uEl=card.querySelector('#fp-u'),errEl=card.querySelector('#fp-err'),btnEl=card.querySelector('#fp-btn');
      if(uEl)uEl.focus();
      if(btnEl)btnEl.addEventListener('click',function(){
        var u=(uEl?uEl.value:'').trim();
        clearAErr(errEl);
        if(!u){showAErr(errEl,'نام کاربری را وارد کنید');return;}
        var found=Auth.getUsers().find(function(x){return x.username===u;});
        if(!found){showAErr(errEl,'کاربری با این نام یافت نشد');return;}
        _renderResetPw(wrap,u);
      });
      if(uEl)uEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&btnEl)btnEl.click();});
      var backBtn=card.querySelector('#fp-back');
      if(backBtn)backBtn.addEventListener('click',function(){var a=RememberedAccounts.getAll();if(a.length)_renderAccounts(wrap,a);else _renderLogin(wrap);});
    });
  }
  function _renderResetPw(wrap,username){
    authTransition(wrap,function(){
      var card=document.createElement('div');card.className='auth-card';
      card.innerHTML='<div class="auth-logo" style="background:linear-gradient(135deg,rgba(245,158,11,.4),rgba(239,68,68,.25))">'+AUTH_LOGO+'</div><h1 class="auth-h">تنظیم رمز جدید</h1><p class="auth-sub">کاربر: <strong style="color:#fff">@'+escH(username)+'</strong></p>'+'<div class="afield"><label for="rp-p">رمز جدید</label><div class="af-in"><span class="af-lico">'+Icons.lock+'</span><input type="password" id="rp-p" placeholder="حداقل ۴ کاراکتر"></div></div>'+'<div class="afield"><label for="rp-r">تکرار رمز</label><div class="af-in"><span class="af-lico">'+Icons.lock+'</span><input type="password" id="rp-r" placeholder="رمز را تکرار کنید"></div></div>'+'<div class="aerr" id="rp-err"></div>'+'<button class="auth-btn" id="rp-btn">'+Icons.save+'<span>ذخیره رمز جدید</span></button>'+'<div class="auth-links"><button class="alink" id="rp-back">← بازگشت</button></div>';
      wrap.appendChild(card);
      var pEl=card.querySelector('#rp-p'),rEl=card.querySelector('#rp-r'),errEl=card.querySelector('#rp-err'),btnEl=card.querySelector('#rp-btn');
      if(pEl)pEl.focus();
      if(btnEl)btnEl.addEventListener('click',function(){
        var p=(pEl?pEl.value:''),r=(rEl?rEl.value:'');
        clearAErr(errEl);
        if(!p||p.length<4){showAErr(errEl,'رمز باید حداقل ۴ کاراکتر باشد');return;}
        if(p!==r){showAErr(errEl,'رمزها یکسان نیستند');return;}
        Auth.updateUser(username,{password:p});
        Toast.success('رمز با موفقیت تغییر یافت');
        _renderLogin(wrap,username);
      });
      var backBtn=card.querySelector('#rp-back');if(backBtn)backBtn.addEventListener('click',function(){_renderForgot(wrap);});
    });
  }
  function _renderRegister(wrap){
    var card=document.createElement('div');card.className='auth-card';
    card.innerHTML='<div class="auth-logo">'+AUTH_LOGO+'</div><h1 class="auth-h">خوش آمدید</h1><p class="auth-sub">اولین حساب مدیر سیستم را بسازید</p>'+'<div class="afield"><label for="rg-n">نام</label><div class="af-in"><span class="af-lico">'+Icons.user+'</span><input type="text" id="rg-n" placeholder="نام کامل"></div></div>'+'<div class="afield"><label for="rg-u">نام کاربری</label><div class="af-in"><span class="af-lico">'+Icons.user+'</span><input type="text" id="rg-u" placeholder="نام کاربری (انگلیسی)"></div></div>'+'<div class="afield"><label for="rg-p">رمز عبور</label><div class="af-in"><span class="af-lico">'+Icons.lock+'</span><input type="password" id="rg-p" placeholder="رمز عبور"></div></div>'+'<div class="aerr" id="rg-err"></div>'+'<button class="auth-btn" id="rg-btn">'+Icons.userPlus+'<span>ساخت حساب سوپرادمین</span></button>';
    wrap.appendChild(card);
    var nEl=card.querySelector('#rg-n'),uEl=card.querySelector('#rg-u'),pEl=card.querySelector('#rg-p'),errEl=card.querySelector('#rg-err'),btnEl=card.querySelector('#rg-btn');
    var eyeBtn=document.createElement('button');eyeBtn.className='af-eye';eyeBtn.type='button';eyeBtn.innerHTML=Icons.eye;eyeBtn.addEventListener('click',function(){if(pEl)pEl.type=pEl.type==='password'?'text':'password';eyeBtn.innerHTML=pEl.type==='password'?Icons.eye:Icons.eyeOff;});
    if(pEl&&pEl.parentNode)pEl.parentNode.appendChild(eyeBtn);
    if(nEl)nEl.focus();
    if(btnEl)btnEl.addEventListener('click',function(){
      var n=(nEl?nEl.value:'').trim(),u=(uEl?uEl.value:'').trim(),p=(pEl?pEl.value:'');
      clearAErr(errEl);
      if(!u||!p){showAErr(errEl,'نام کاربری و رمز الزامی است');return;}
      var res=Auth.register(u,p,n);
      if(res.ok){RememberedAccounts.remember(u,n||u,new Date().toISOString());handleLoginSuccess(u);}
      else showAErr(errEl,'خطا در ساخت حساب: '+(res.reason||''));
    });
    if(pEl)pEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&btnEl)btnEl.click();});
  }
  return{show:show,_renderLogin:_renderLogin,_renderSignUp:_renderSignUp,_renderForgot:_renderForgot,_renderRegister:_renderRegister};
})();
</script>
<script>
var UI=(function(){
  function topbar(state){
    var t=state.today,remCnt=Reminders.pendingCount(),pendCnt=Auth.pendingCount(),hr=new Date().getHours(),greeting=hr<11?'صبح بخیر':hr<16?'ظهر بخیر':hr<20?'عصر بخیر':'شب بخیر';
    var el=document.createElement('div');el.className='topbar';
    el.innerHTML='<div class="topbar-in"><div class="brand"><div class="brand-logo"><svg width="18" height="18" viewBox="0 0 36 36" fill="none"><rect x="4" y="4" width="12" height="12" rx="3" fill="white" opacity="0.9"/><rect x="20" y="4" width="12" height="12" rx="3" fill="white" opacity="0.6"/><rect x="4" y="20" width="12" height="12" rx="3" fill="white" opacity="0.6"/><rect x="20" y="20" width="12" height="12" rx="3" fill="#c4b5fd" opacity="0.9"/></svg></div><div><div class="brand-name">میزان</div><div class="brand-date">'+greeting+' · '+Jalali.fmt(t[0],t[1],t[2])+' — '+Jalali.WDSF[Jalali.weekday(t[0],t[1],t[2])]+'</div></div></div><div class="topbar-spacer"></div>'+(Perms.isAdmin()&&pendCnt>0?'<button class="ib no-print" id="tb-pend" title="درخواست‌های تأیید نشده" style="color:var(--warn);border-color:rgba(245,158,11,.4)">'+Icons.users+'<span class="bdot" style="background:var(--warn)">'+pendCnt+'</span></button>':'')+'<button class="ib no-print" id="tb-reload" title="به‌روزرسانی صفحه" aria-label="به‌روزرسانی صفحه"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></svg></button><button class="ib no-print" id="tb-rem">'+Icons.bell+(remCnt>0?'<span class="bdot">'+remCnt+'</span>':'')+'</button><button class="ib no-print" id="tb-theme">'+(Store.getTheme()==='dark'?Icons.sun:Icons.moon)+'</button><button class="ib no-print" id="tb-sets">'+Icons.settings+'</button><button class="ib no-print" id="tb-out">'+Icons.logout+'</button></div>';
    return el;
  }
  function navTabs(page){
    var tabs=[{id:'today',label:'امروز',icon:Icons.home},{id:'months',label:'ماه‌ها',icon:Icons.grid},{id:'reminders',label:'یادآوری',icon:Icons.bell,badge:Reminders.pendingCount()},{id:'records',label:'سوابق',icon:Icons.activity},{id:'finance',label:'امور مالی',icon:Icons.wallet},{id:'achievements',label:'دستاوردها',icon:Icons.award},{id:'settings',label:'تنظیمات',icon:Icons.settings}];
    if(Perms.isAdmin())tabs.splice(tabs.length-1,0,{id:'users',label:'کاربران',icon:Icons.users,badge:Auth.pendingCount()});
    var nav=document.createElement('div');nav.className='nav-tabs no-print';
    tabs.forEach(function(t){var tab=document.createElement('div');tab.className='nav-tab'+(page===t.id?' active':'');tab.dataset.page=t.id;tab.innerHTML=t.icon+'<span>'+t.label+'</span>'+((t.badge||0)>0?'<span class="bdot">'+t.badge+'</span>':'');tab.addEventListener('click',function(){App.navigate(t.id);});nav.appendChild(tab);});
    return nav;
  }
  function calGrid(container,year,mi,month){
    if(!container)return;
    var dim=Jalali.daysInMonth(year,mi+1),fw=Jalali.weekday(year,mi+1,1),today=Jalali.today(),html='';
    for(var i=0;i<7;i++)html+='<div class="cal-h'+(i===6?' fri':'')+'">'+Jalali.WDS[i]+'</div>';
    for(var i=0;i<fw;i++)html+='<div class="cal-cell out"></div>';
    for(var d=1;d<=dim;d++){
      var ds=Jalali.fmt(year,mi+1,d),wd=Jalali.weekday(year,mi+1,d),ev=Payroll.dayEvents(month,ds);
      var cls=['cal-cell'];
      if(wd===6)cls.push('fri');
      if(today[0]===year&&today[1]===mi+1&&today[2]===d)cls.push('today-c');
      var dots=[];
      if(ev.hours>0){dots.push('<span style="background:var(--ok)"></span>');if(ev.hours>=6)cls.push('full-work');}
      if(ev.fullLeave){cls.push('leave-full');dots.push('<span style="background:var(--leave)"></span>');}
      if(ev.hourlyLeave){cls.push('leave-hourly');dots.push('<span style="background:var(--hourly)"></span>');}
      if(ev.storeClosed){cls.push('store-closed');dots.push('<span style="background:var(--closed)"></span>');}
      if(ev.websiteSales+ev.storeSales>0)dots.push('<span style="background:var(--acc)"></span>');
      if(ev.hours===0&&!ev.fullLeave&&!ev.hourlyLeave&&!ev.storeClosed&&wd!==6){var p=Jalali.parse(ds);if(p){var tn=today[0]*10000+today[1]*100+today[2],cn=p[0]*10000+p[1]*100+p[2];if(cn<tn)cls.push('missing');}}
      html+='<div class="'+cls.join(' ')+'" data-date="'+ds+'">'+d+(dots.length?'<div class="dots">'+dots.join('')+'</div>':'')+'</div>';
    }
    container.innerHTML=html;
    container.querySelectorAll('.cal-cell[data-date]').forEach(function(c){c.addEventListener('click',function(){App.openDayDetail(c.dataset.date);});});
  }
  function renderToday(state){
    var t=state.today,month=Store.loadMonth(t[0],t[1]-1),cfg=Store.loadSettings(),stats=Payroll.compute(month,cfg);
    var missing=Payroll.missingDays(month,t[0],t[1]-1),todayStr=Jalali.fmt(t[0],t[1],t[2]),ev=Payroll.dayEvents(month,todayStr),wd=Jalali.weekday(t[0],t[1],t[2]);
    var goals=Goals.load().filter(function(g){return g.status==='inprogress';}).slice(0,3);
    var frag=document.createDocumentFragment();
    var pendCnt=Auth.pendingCount();
    if(Perms.isAdmin()&&pendCnt>0){
      var notif=document.createElement('div');
      notif.style.cssText='background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);border-radius:10px;padding:11px 15px;margin-bottom:15px;display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--warn);font-weight:600';
      notif.innerHTML=Icons.bell+'<span>درخواست ثبت‌نام جدید در انتظار تأیید: <strong>'+pendCnt+' درخواست</strong></span>';
      notif.addEventListener('click',function(){App.navigate('users');});
      frag.appendChild(notif);
    }
    var hero=document.createElement('div');hero.className='today-hero';
    hero.innerHTML='<div class="th-in"><div><div class="th-wd">'+Jalali.WDSF[wd]+'</div><div class="th-date">'+Jalali.fmt(t[0],t[1],t[2])+'</div><div class="th-meta">'+Jalali.MONTHS[t[1]-1].fa+' '+t[0]+'</div></div><div class="th-clock" id="today-clock">--:--:--</div></div>';
    frag.appendChild(hero);
    var qa=document.createElement('div');qa.className='quick-actions no-print';
    [['ثبت ساعت کار',Icons.clock,function(){App.openHourForm();}],['فروش وبسایت',Icons.bag,function(){App.openSaleForm('website');}],['فروش فروشگاه',Icons.store,function(){App.openSaleForm('store');}],['ثبت مرخصی',Icons.calendar,function(){App.openLeaveForm();}],['ثبت هزینه',Icons.receipt,function(){App.openMoneyForm('expenses');}]].forEach(function(item){var b=document.createElement('button');b.className='btn btn-ghost';b.innerHTML=item[1]+'<span>'+item[0]+'</span>';b.addEventListener('click',item[2]);qa.appendChild(b);});
    frag.appendChild(qa);
    var dg=document.createElement('div');dg.className='dash-grid stagger';

  function renderStorMon(){
    var body=document.getElementById('stor-body');if(!body)return;
    try{
      var used=Store.storageSize(),quota=5*1024*1024;
      try{navigator.storage.estimate().then(function(e){if(e&&e.usage)used=e.usage;if(e&&e.quota)quota=e.quota;_drawStor(body,used,quota);}).catch(function(){_drawStor(body,used,quota);});}
      catch(e){_drawStor(body,used,quota);}
    }catch(e){body.innerHTML='خطا در محاسبه';}
  }
  function _drawStor(body,used,quota){
    var pct=Math.min(100,(used/quota)*100),cls=pct>=95?'sb-crit':pct>=80?'sb-warn':'sb-ok';
    body.innerHTML='<div class="storage-stats"><div class="ss-cell"><div class="ss-lbl">مصرف</div><div class="ss-val">'+Fmt.fileSize(used)+'</div></div><div class="ss-cell"><div class="ss-lbl">باقی‌مانده</div><div class="ss-val">'+Fmt.fileSize(Math.max(0,quota-used))+'</div></div><div class="ss-cell"><div class="ss-lbl">درصد</div><div class="ss-val">'+pct.toFixed(1)+'%</div></div></div><div class="storage-bar"><div class="sb-fill '+cls+'" style="width:'+pct.toFixed(1)+'%"></div></div>'+(pct>=95?'<div class="ss-warn crit">'+Icons.alert+'هشدار بحرانی!</div>':pct>=80?'<div class="ss-warn warn">'+Icons.alert+'هشدار: بیش از ۸۰٪ استفاده شده</div>':'')+'<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" id="stor-ref">'+Icons.refresh+'<span>بروزرسانی</span></button></div>';
    var ref=document.getElementById('stor-ref');if(ref)ref.addEventListener('click',renderStorMon);
  }

      try{document.documentElement.setAttribute('data-theme',Store.getTheme()||'light');}catch(e){}
      try{
        var users=Auth.getUsers();
        if(users.length>0){var su=Auth.getSuperUsername()||users[0].username;var mv=Store.migrateToUserNamespace(su);if(mv>0)console.log('[Migration] moved',mv,'keys to',su);}
      }catch(e){console.warn('Migration error',e);}
      runSplash(function(){
        try{
          if(Auth.isLoggedIn()){
            var appEl=document.getElementById('app');
            if(appEl){appEl.style.transition='opacity .48s ease,transform .48s cubic-bezier(.4,0,.2,1)';appEl.style.opacity='1';appEl.style.transform='scale(1)';}
            render();
          }else{
            AuthUI.show();
          }
        }catch(e){
          console.error('Post-splash init error',e);
          try{AuthUI.show();}catch(e2){console.error('AuthUI.show fallback failed',e2);}
        }
      });
    }catch(e){
      console.error('App.init fatal error',e);
      try{AuthUI.show();}catch(e2){}
    }
  }
  return{init:init,render:render,navigate:navigate,refresh:refresh,toggleTheme:toggleTheme,updateBadge:updateBadge,openMonth:openMonth,openDayDetail:openDayDetail,openHourForm:openHourForm,openSaleForm:openSaleForm,openLeaveForm:openLeaveForm,openMoneyForm:openMoneyForm,editRecord:editRecord,deleteRecord:deleteRecord,deleteMonthConfirm:deleteMonthConfirm,openReminderForm:openReminderForm,openIdeaForm:openIdeaForm,openArticleForm:openArticleForm,openGoalForm:openGoalForm,openUserForm:openUserForm,openPrintDialog:openPrintDialog,exportData:exportData,importData:importData,umView:umView,umManage:umManage,umPerms:umPerms,umAssignWs:umAssignWs,umResetPw:umResetPw,umBackup:umBackup,umDelete:umDelete,openTierForm:openTierForm,deleteTier:deleteTier,moveTier:moveTier};
})();
