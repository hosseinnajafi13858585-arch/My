<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>مدیریت کار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --r-sm:6px;--r-md:12px;--r-lg:18px;--r-xl:24px;
  --sp:8px;--sp2:16px;--sp3:24px;--sp4:32px;
  --font:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  --mono:Consolas,'Courier New',monospace;
  --tr:.22s cubic-bezier(.4,0,.2,1);
  --sh-sm:0 1px 4px rgba(0,0,0,.08);
  --sh-md:0 6px 20px rgba(0,0,0,.10);
  --sh-lg:0 16px 48px rgba(0,0,0,.15)
}
[data-theme=light]{
  --bg:#f0f4f9;--bg2:#e8eef7;--bg3:#f5f0e8;
  --surf:rgba(255,255,255,.82);--surfs:#fff;--surf2:rgba(255,255,255,.65);
  --bd:rgba(15,23,42,.09);--bds:rgba(15,23,42,.18);
  --tx:#0f172a;--txm:#475569;--txs:#64748b;
  --pri:#6366f1;--pri2:#4f46e5;--pris:rgba(99,102,241,.12);
  --acc:#8b5cf6;
  --ok:#059669;--oks:rgba(5,150,105,.13);
  --warn:#d97706;--warns:rgba(217,119,6,.14);
  --err:#dc2626;--errs:rgba(220,38,38,.12);
  --glass:rgba(255,255,255,.72);
  --ts:rgba(15,23,42,.025);--th:rgba(99,102,241,.06);
  --shc:0 6px 24px rgba(15,23,42,.08);--sc:rgba(15,23,42,.18);
  --leave:#f59e0b;--leaves:rgba(245,158,11,.16);
  --hourly:#ea580c;--hourlys:rgba(234,88,12,.14);
  --closed:#6366f1;--closeds:rgba(99,102,241,.14)
}
[data-theme=dark]{
  --bg:#060b18;--bg2:#0a1228;--bg3:#130820;
  --surf:rgba(14,22,40,.82);--surfs:#0d1626;--surf2:rgba(20,32,54,.65);
  --bd:rgba(148,163,184,.1);--bds:rgba(148,163,184,.2);
  --tx:#e2e8f0;--txm:#94a3b8;--txs:#64748b;
  --pri:#818cf8;--pri2:#a5b4fc;--pris:rgba(129,140,248,.18);
  --acc:#a78bfa;
  --ok:#10b981;--oks:rgba(16,185,129,.16);
  --warn:#f59e0b;--warns:rgba(245,158,11,.16);
  --err:#ef4444;--errs:rgba(239,68,68,.16);
  --glass:rgba(14,22,40,.72);
  --ts:rgba(148,163,184,.04);--th:rgba(129,140,248,.1);
  --shc:0 6px 24px rgba(0,0,0,.45);--sc:rgba(148,163,184,.22);
  --leave:#f59e0b;--leaves:rgba(245,158,11,.16);
  --hourly:#fb923c;--hourlys:rgba(251,146,60,.16);
  --closed:#818cf8;--closeds:rgba(129,140,248,.18)
}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;transition:background var(--tr),color var(--tr)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sc);border-radius:7px;border:2px solid transparent;background-clip:padding-box}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--pri);text-decoration:none}
/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#0a0e2a 0%,#1a0533 40%,#0d1a3d 70%,#0a0e2a 100%)}
#splash.hiding{animation:splashOut .65s cubic-bezier(.4,0,.2,1) forwards}
@keyframes splashOut{0%{opacity:1}100%{opacity:0;pointer-events:none}}
.splash-orb{position:absolute;border-radius:50%;filter:blur(80px);animation:orbFloat 6s ease-in-out infinite}
.splash-orb.o1{width:480px;height:480px;background:radial-gradient(circle,rgba(99,102,241,.35),transparent 70%);top:-140px;left:-100px;animation-delay:0s}
.splash-orb.o2{width:380px;height:380px;background:radial-gradient(circle,rgba(139,92,246,.28),transparent 70%);bottom:-90px;right:-70px;animation-delay:-2s}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-28px) scale(1.04)}}
.spark{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);animation:sparkFloat linear infinite}
@keyframes sparkFloat{0%{transform:translateY(0) translateX(0);opacity:0}20%{opacity:.9}80%{opacity:.4}100%{transform:translateY(-80vh) translateX(var(--dx,0px));opacity:0}}
.splash-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px}
.splash-logo-wrap{width:90px;height:90px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.18);border-radius:26px;box-shadow:0 20px 60px rgba(99,102,241,.3),inset 0 1px 0 rgba(255,255,255,.2);animation:logoAppear .8s cubic-bezier(.34,1.56,.64,1) .2s both}
@keyframes logoAppear{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.splash-title{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.4px;animation:fadeUpIn .7s ease .6s both}
.splash-subtitle{font-size:13px;color:rgba(255,255,255,.55);animation:fadeUpIn .7s ease .75s both}
@keyframes fadeUpIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.splash-progress-bar{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:190px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;animation:fadeUpIn .5s ease .9s both}
.splash-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#6366f1,#a78bfa,#c4b5fd);border-radius:3px;animation:fillProg 1.2s cubic-bezier(.4,0,.2,1) .3s both}
@keyframes fillProg{from{width:0%}to{width:100%}}
/* ===== AUTH WRAPPER ===== */
#auth-wrapper{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;overflow:hidden;min-height:100vh;background:linear-gradient(135deg,#0a0e2a 0%,#1a0533 40%,#0d1a3d 70%,#0a0e2a 100%)}
#auth-wrapper.visible{display:flex}
.auth-bg-orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;animation:orbFloat 9s ease-in-out infinite}
.auth-bg-orb.ao1{width:560px;height:560px;background:radial-gradient(circle,rgba(99,102,241,.22),transparent 70%);top:-180px;right:-90px;animation-delay:0s}
.auth-bg-orb.ao2{width:460px;height:460px;background:radial-gradient(circle,rgba(139,92,246,.18),transparent 70%);bottom:-130px;left:-90px;animation-delay:-3s}
.auth-bg-orb.ao3{width:280px;height:280px;background:radial-gradient(circle,rgba(59,130,246,.16),transparent 70%);top:35%;left:28%;animation-delay:-6s}
#auth-particles{position:absolute;inset:0;pointer-events:none}
/* ===== AUTH CARD ===== */
.auth-card{position:relative;z-index:2;width:100%;max-width:420px;margin:0 16px;background:rgba(255,255,255,.07);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,.14);border-radius:28px;box-shadow:0 32px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.1);padding:36px 32px;animation:cardIn .55s cubic-bezier(.34,1.2,.64,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-card.shake{animation:cardShake .4s cubic-bezier(.36,.07,.19,.97) both}
@keyframes cardShake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.auth-logo{width:62px;height:62px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(99,102,241,.4),rgba(139,92,246,.3));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:17px;margin:0 auto 18px;box-shadow:0 8px 24px rgba(99,102,241,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.auth-logo svg{width:32px;height:32px}
.auth-h{text-align:center;font-size:21px;font-weight:800;color:#fff;letter-spacing:-.3px;margin-bottom:6px}
.auth-sub{text-align:center;font-size:13px;color:rgba(255,255,255,.5);margin-bottom:22px;line-height:1.55}
.accs-scroll{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;max-height:290px;overflow-y:auto}
.accs-scroll::-webkit-scrollbar{width:3px}
.accs-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.acc-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;cursor:pointer;transition:all .2s ease;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.acc-row:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);transform:translateX(-2px)}
.acc-row:focus{outline:2px solid rgba(129,140,248,.7);outline-offset:2px}
.acc-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.acc-info{flex:1;min-width:0}
.acc-name{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-user{font-size:11px;color:rgba(255,255,255,.45);font-family:var(--mono)}
.acc-time{font-size:10px;color:rgba(255,255,255,.33);margin-top:1px}
.acc-arrow{color:rgba(255,255,255,.38);flex-shrink:0;font-size:17px;transition:var(--tr)}
.acc-row:hover .acc-arrow{color:rgba(255,255,255,.75);transform:translateX(-3px)}
.acc-del{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.22);color:rgba(239,68,68,.75);flex-shrink:0;transition:all .2s}
.acc-del:hover{background:rgba(239,68,68,.28);color:#ef4444}
.acc-del svg{width:10px;height:10px}
.auth-other{width:100%;padding:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:11px;color:rgba(255,255,255,.65);font-size:13px;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.auth-other:hover{background:rgba(255,255,255,.11);color:#fff;border-color:rgba(255,255,255,.2)}
.auth-other svg{width:14px;height:14px}
.afield{margin-bottom:13px}
.afield label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:5px}
.afield .af-in{position:relative}
.afield input{width:100%;padding:11px 38px 11px 13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:11px;color:#fff;font-size:14px;transition:all .22s ease;outline:none}
.afield input::placeholder{color:rgba(255,255,255,.28)}
.afield input:focus{background:rgba(255,255,255,.12);border-color:rgba(139,92,246,.55);box-shadow:0 0 0 4px rgba(139,92,246,.14),0 0 18px rgba(139,92,246,.08)}
.afield input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px rgba(99,102,241,.25) inset;-webkit-text-fill-color:#fff}
.af-lico{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.38);pointer-events:none;width:15px;height:15px}
.af-lico svg{width:15px;height:15px}
.af-eye{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.38);cursor:pointer;transition:color .2s;background:none;border:none;padding:0;display:flex;align-items:center}
.af-eye:hover{color:rgba(255,255,255,.75)}
.af-eye svg{width:14px;height:14px}
.aerr{font-size:12px;min-height:16px;margin-bottom:9px;display:flex;align-items:flex-start;gap:5px;line-height:1.45;color:rgba(239,68,68,.9)}
.aerr svg{width:13px;height:13px;flex-shrink:0;margin-top:1px}
.aerr.info{color:rgba(251,191,36,.9)}
.auth-remember{display:flex;align-items:center;gap:7px;margin-bottom:14px;cursor:pointer;width:fit-content}
.auth-remember input{width:14px;height:14px;accent-color:#818cf8;cursor:pointer}
.auth-remember span{font-size:12px;color:rgba(255,255,255,.5)}
.auth-btn{width:100%;padding:12px;border-radius:13px;font-size:15px;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:1px solid rgba(255,255,255,.14);box-shadow:0 5px 18px rgba(99,102,241,.38),inset 0 1px 0 rgba(255,255,255,.18);transition:all .22s ease;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;will-change:transform,box-shadow}
.auth-btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 9px 26px rgba(99,102,241,.5)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.auth-btn .spinner{width:17px;height:17px;border:2px solid rgba(255,255,255,.28);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-links{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.alink{font-size:12px;color:rgba(255,255,255,.45);transition:color .2s;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;text-align:center}
.alink:hover{color:rgba(165,180,252,.85)}
.alink.hi{color:rgba(167,139,250,.8)}
.alink.hi:hover{color:#c4b5fd}
.alink-div{width:1px;height:11px;background:rgba(255,255,255,.14)}
.pending-info{padding:13px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.24);border-radius:11px;margin-bottom:13px;font-size:12px;line-height:1.6;color:rgba(255,255,255,.8)}
.pending-info strong{color:rgba(251,191,36,.9);display:block;margin-bottom:3px}
.sel-acc-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.sel-acc-av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;flex-shrink:0}
#door-overlay{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;perspective:1200px}
#door-overlay.active{display:flex}
.door-l,.door-r{position:absolute;width:52%;height:100%;background:linear-gradient(180deg,rgba(28,18,58,.96) 0%,rgba(8,12,38,.98) 100%);transition:transform 1.1s cubic-bezier(.4,0,.2,1);will-change:transform}
.door-l{left:0;transform-origin:left center;border-right:1px solid rgba(255,255,255,.1)}
.door-r{right:0;transform-origin:right center;border-left:1px solid rgba(255,255,255,.1)}
.door-l.open{transform:rotateY(-92deg)}
.door-r.open{transform:rotateY(92deg)}
.door-glow{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 45%,rgba(99,102,241,.28) 0%,transparent 58%);transition:opacity .7s ease;pointer-events:none}
.door-glow.on{opacity:1}
#db-blur{position:fixed;inset:0;z-index:4999;backdrop-filter:blur(28px) brightness(.55);background:rgba(4,8,20,.65);transition:opacity 1s ease;display:none}
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);background:var(--glass);border-bottom:1px solid var(--bd);box-shadow:var(--sh-sm)}
.topbar-in{max-width:1360px;margin:0 auto;padding:11px var(--sp3);display:flex;align-items:center;gap:var(--sp2)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.32);flex-shrink:0}
.brand-logo svg{width:18px;height:18px}
.brand-name{font-size:15px;font-weight:700}
.brand-date{font-size:11px;color:var(--txs);margin-top:1px}
.topbar-spacer{flex:1}
.ib{width:36px;height:36px;border-radius:9px;background:var(--surf2);border:1px solid var(--bd);display:grid;place-items:center;color:var(--txm);transition:var(--tr);position:relative;flex-shrink:0}
.ib:hover{color:var(--pri);border-color:var(--pri);transform:translateY(-1px)}
.ib svg{width:16px;height:16px}
.ib .bdot{position:absolute;top:2px;left:2px;min-width:14px;height:14px;border-radius:7px;background:var(--err);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.main{max-width:1360px;width:100%;margin:0 auto;padding:var(--sp3);flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:var(--tr);border:1px solid transparent;white-space:nowrap;line-height:1.4}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(99,102,241,.4)}
.btn-ghost{background:var(--surf2);border-color:var(--bd);color:var(--tx)}
.btn-ghost:hover{border-color:var(--pri);color:var(--pri)}
.btn-danger{background:var(--errs);color:var(--err)}
.btn-danger:hover{background:var(--err);color:#fff}
.btn-success{background:var(--oks);color:var(--ok)}
.btn-success:hover{background:var(--ok);color:#fff}
.btn-warn{background:var(--warns);color:var(--warn)}
.btn-warn:hover{background:var(--warn);color:#fff}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-sm svg{width:13px;height:13px}
.card{background:var(--surf);backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--shc);transition:var(--tr)}
.card-pad{padding:var(--sp3)}
.sec-hd{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;margin-bottom:var(--sp2)}
.sec-hd .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--acc));flex-shrink:0}
.sec-hd svg{width:15px;height:15px;color:var(--pri)}
.sec-hd .cnt{margin-right:auto;font-size:11px;font-weight:600;color:var(--txs);background:var(--surf2);padding:2px 8px;border-radius:16px}
.collapsible{overflow:hidden}
.coll-hd{display:flex;align-items:center;gap:9px;padding:13px var(--sp3);cursor:pointer;user-select:none;transition:background var(--tr)}
.coll-hd:hover{background:var(--th)}
.coll-hd .chev{margin-right:auto;transition:transform var(--tr);color:var(--txs)}
.coll-hd .chev svg{width:15px;height:15px}
.collapsible.closed .chev{transform:rotate(-90deg)}
.coll-body{transition:max-height .35s ease,padding .25s ease;padding:0 var(--sp3) var(--sp3);overflow:hidden}
.collapsible.closed .coll-body{max-height:0!important;padding-top:0;padding-bottom:0}
.page-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp2);margin-bottom:var(--sp3);flex-wrap:wrap}
.page-hd h2{font-size:23px;font-weight:800;letter-spacing:-.4px}
.page-hd p{color:var(--txs);font-size:13px;margin-top:3px}
.year-nav{display:flex;align-items:center;gap:9px;margin-bottom:var(--sp3)}
.yn-btn{width:34px;height:34px;border-radius:9px;background:var(--surf2);border:1px solid var(--bd);display:grid;place-items:center;color:var(--txm);transition:var(--tr)}
.yn-btn:hover{border-color:var(--pri);color:var(--pri)}
.yn-btn svg{width:15px;height:15px}
.yn-label{font-size:18px;font-weight:800;min-width:68px;text-align:center}
.months-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:var(--sp2)}
.month-card{position:relative;overflow:hidden;padding:var(--sp3);cursor:pointer;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-lg);transition:var(--tr)}
.month-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--pris),transparent 65%);opacity:0;transition:var(--tr)}
.month-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--pri)}
.month-card:hover::before{opacity:1}
.month-card>*{position:relative;z-index:1}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.mc-ico{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--acc));display:grid;place-items:center;color:#fff}
.mc-ico svg{width:20px;height:20px}
.mc-num{font-size:11px;color:var(--txs);font-weight:600}
.mc-name{font-size:19px;font-weight:800;margin-bottom:3px}
.mc-en{font-size:11px;color:var(--txs);margin-bottom:11px}
.mc-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mc-stat{background:var(--surf2);border-radius:7px;padding:6px 8px}
.mc-stat .lbl{font-size:10px;color:var(--txs)}
.mc-stat .val{font-size:13px;font-weight:700}
.month-card.is-cur{border-color:var(--pri)}
.month-card.is-cur::after{content:'جاری';position:absolute;top:11px;left:11px;font-size:10px;font-weight:700;color:#fff;background:var(--ok);padding:2px 6px;border-radius:14px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:var(--sp2);margin-bottom:var(--sp3)}
.stat-card{padding:var(--sp2) var(--sp3);background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);transition:var(--tr)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.sc-ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.sc-ico svg{width:16px;height:16px}
.sc-lbl{font-size:11px;color:var(--txs);font-weight:600}
.sc-val{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.2;margin-top:2px}
.sc-sub{font-size:11px;color:var(--txs);margin-top:2px}
.sc-blue .sc-ico{background:var(--pris);color:var(--pri)}
.sc-green .sc-ico{background:var(--oks);color:var(--ok)}
.sc-amber .sc-ico{background:var(--warns);color:var(--warn)}
.sc-red .sc-ico{background:var(--errs);color:var(--err)}
.sc-cyan .sc-ico{background:rgba(8,145,178,.14);color:#0891b2}
.sc-violet .sc-ico{background:rgba(139,92,246,.14);color:var(--acc)}
.sc-orange .sc-ico{background:var(--hourlys);color:var(--hourly)}
.sc-teal .sc-ico{background:rgba(20,184,166,.15);color:#14b8a6}
.final-card{grid-column:1/-1;background:linear-gradient(135deg,var(--pri),var(--acc))!important;color:#fff!important;border:none!important}
.final-card .sc-lbl,.final-card .sc-sub{color:rgba(255,255,255,.85)!important}
.final-card .sc-ico{background:rgba(255,255,255,.2)!important;color:#fff!important}
.final-card .sc-val{font-size:22px!important}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--txm)}
.field input,.field select,.field textarea{background:var(--surf2);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;transition:var(--tr);width:100%;font-size:14px;line-height:1.5;min-height:38px}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pris);background:var(--surfs)}
.field-full{grid-column:1/-1}
.field.h{display:none}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:var(--sp2)}
.search-box{position:relative;flex:1;min-width:180px}
.search-box .s-ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txs);pointer-events:none}
.search-box input{width:100%;padding:8px 32px 8px 11px;background:var(--surf2);border:1px solid var(--bd);border-radius:9px;font-size:14px}
.search-box input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pris)}
.sel-pill{padding:8px 12px;border-radius:9px;background:var(--surf2);border:1px solid var(--bd);font-size:14px;transition:var(--tr);cursor:pointer}
.sel-pill:focus{outline:none;border-color:var(--pri)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--bd)}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt thead th{text-align:right;padding:10px 12px;background:var(--surf2);color:var(--txm);font-weight:700;border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0}
table.dt tbody td{padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
table.dt tbody tr:nth-child(even){background:var(--ts)}
table.dt tbody tr:hover{background:var(--th)}
table.dt tbody tr:last-child td{border-bottom:none}
.td-num{font-weight:600}
.td-act{display:flex;gap:4px}
.rb{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--surf2);border:1px solid var(--bd);transition:var(--tr)}
.rb svg{width:12px;height:12px}
.rb.ed:hover{color:var(--pri);border-color:var(--pri)}
.rb.dl:hover{color:var(--err);border-color:var(--err)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:14px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-ok{background:var(--oks);color:var(--ok)}
.badge-warn{background:var(--warns);color:var(--warn)}
.badge-err{background:var(--errs);color:var(--err)}
.badge-pri{background:var(--pris);color:var(--pri)}
.badge-violet{background:rgba(139,92,246,.14);color:var(--acc)}
.badge-active{background:var(--oks);color:var(--ok)}
.badge-inactive{background:var(--errs);color:var(--err)}
.badge-pending{background:rgba(245,158,11,.18);color:var(--warn)}
.badge-approved{background:var(--oks);color:var(--ok)}
.badge-rejected{background:var(--errs);color:var(--err)}
.badge-super{background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff}
.modal-back{position:fixed;inset:0;z-index:200;background:rgba(2,6,23,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fadeIn .2s ease}
.modal{background:var(--surfs);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:slideUp .27s cubic-bezier(.4,0,.2,1)}
.modal.lg{max-width:680px}.modal.xl{max-width:840px}
.modal-hd{display:flex;align-items:center;gap:9px;padding:15px var(--sp3);border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--surfs);z-index:2}
.modal-hd h3{font-size:15px;font-weight:700;flex:1}
.modal-hd .mcls{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surf2);color:var(--txs);transition:var(--tr)}
.modal-hd .mcls:hover{color:var(--err);background:var(--errs)}
.modal-hd .mcls svg{width:15px;height:15px}
.modal-body{padding:var(--sp3)}
.modal-ft{display:flex;gap:9px;justify-content:flex-end;padding:13px var(--sp3);border-top:1px solid var(--bd);position:sticky;bottom:0;background:var(--surfs);flex-wrap:wrap}
.toast-stack{position:fixed;top:16px;left:16px;z-index:900;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:9px;background:var(--surfs);border:1px solid var(--bd);box-shadow:var(--sh-lg);min-width:220px;max-width:320px;animation:toastIn .27s cubic-bezier(.4,0,.2,1);pointer-events:auto}
.toast.out{animation:toastOut .27s forwards}
.t-ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.t-ico svg{width:15px;height:15px}
.toast.success .t-ico{background:var(--oks);color:var(--ok)}
.toast.error .t-ico{background:var(--errs);color:var(--err)}
.toast.info .t-ico{background:var(--pris);color:var(--pri)}
.t-msg{font-size:13px;font-weight:600;line-height:1.4}
.nav-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:var(--sp3);padding:5px;background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r-lg)}
.nav-tab{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--txm);transition:var(--tr);cursor:pointer;position:relative}
.nav-tab:hover{background:var(--pris);color:var(--pri)}
.nav-tab.active{background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff}
.nav-tab svg{width:14px;height:14px}
.nav-tab .bdot{position:absolute;top:2px;left:2px;min-width:14px;height:14px;border-radius:7px;background:var(--err);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 2px}
.today-hero{padding:var(--sp4);background:linear-gradient(135deg,var(--pri),var(--acc));border-radius:var(--r-xl);color:#fff;margin-bottom:var(--sp3)}
.today-hero .th-in{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.th-date{font-size:28px;font-weight:800;line-height:1}
.th-wd{font-size:15px;font-weight:600;opacity:.9;margin-top:4px}
.th-meta{font-size:13px;opacity:.8;margin-top:3px}
.th-clock{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:2px}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp3)}
.quick-actions .btn{flex:1;min-width:115px;justify-content:center}
.pw-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;padding:var(--sp3);background:linear-gradient(135deg,var(--pris),rgba(5,150,105,.07));border:1px solid var(--bd);border-radius:var(--r-lg);margin-bottom:var(--sp3)}
.pw-cell .pw-ttl{font-size:11px;font-weight:700;color:var(--txm);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.pw-cell .pw-ttl svg{width:13px;height:13px;color:var(--pri)}
.pw-cell .pw-val{font-size:18px;font-weight:800}
.pw-cell .pw-sub{font-size:11px;color:var(--txs);margin-top:2px}
.cal-widget{padding:var(--sp3);background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--shc);margin-bottom:var(--sp3)}
.cal-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cal-now{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--pris),rgba(8,145,178,.07));border:1px solid var(--bd);flex:1;min-width:220px}
.cal-date-big{font-size:24px;font-weight:800;line-height:1}
.cal-meta{font-size:12px;color:var(--txs);line-height:1.6}
.cal-meta b{color:var(--tx);font-weight:700}
.cal-clock{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:1px;padding:8px 13px;border-radius:var(--r-md);background:var(--surf2);border:1px solid var(--bd)}
.cal-legend{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--txs)}
.cal-legend .lg{display:inline-flex;align-items:center;gap:4px}
.cal-legend .lg .dot{width:7px;height:7px;border-radius:50%}
.cal-grid-wrap{display:grid;grid-template-columns:1fr;gap:11px}
@media(min-width:720px){.cal-grid-wrap{grid-template-columns:1fr 1fr}}
.cal-month-box{background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r-md);padding:11px}
.cal-month-title{text-align:center;font-weight:700;font-size:13px;margin-bottom:7px}
.cal-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-h{text-align:center;font-size:10px;font-weight:700;color:var(--txs);padding:2px 0}
.cal-h.fri{color:var(--err)}
.cal-cell{aspect-ratio:1;border-radius:5px;cursor:pointer;display:grid;place-items:center;font-size:11px;font-weight:600;position:relative;transition:var(--tr);border:1px solid transparent}
.cal-cell:hover{background:var(--pris);transform:scale(1.07)}
.cal-cell.out{opacity:.22}
.cal-cell.today-c{border-color:var(--pri);color:var(--pri);font-weight:800}
.cal-cell.fri{color:var(--err)}
.cal-cell .dots{position:absolute;bottom:2px;display:flex;gap:2px}
.cal-cell .dots span{width:3px;height:3px;border-radius:50%}
.cal-cell.full-work{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.cal-cell.leave-full{background:var(--leaves);border-color:var(--leave);color:var(--leave)}
.cal-cell.leave-hourly{background:var(--hourlys);border-color:var(--hourly);color:var(--hourly)}
.cal-cell.store-closed{background:var(--closeds);border-color:var(--closed);color:var(--closed)}
.cal-cell.missing{background:var(--errs);border-color:var(--err)}
.cal-side{background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r-md);padding:11px;max-height:270px;overflow-y:auto}
.cal-side h4{font-size:12px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:4px}
.cal-side h4 svg{width:13px;height:13px;color:var(--err)}
.missing-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;background:var(--errs);font-size:12px;cursor:pointer;transition:var(--tr);margin-bottom:4px}
.missing-item:hover{background:var(--err);color:#fff}
.missing-item .mi-d{font-weight:700}
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:var(--sp2);margin-bottom:var(--sp3)}
.analytics-card{padding:var(--sp3);background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-lg)}
.analytics-card h4{font-size:13px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.analytics-card h4 svg{width:14px;height:14px;color:var(--pri)}
.bar-chart{display:flex;align-items:flex-end;gap:3px;height:85px;padding-top:7px}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--pri),var(--acc));border-radius:3px 3px 0 0;min-height:2px;position:relative;transition:var(--tr)}
.bar-chart .bar:hover{opacity:.8}
.bar-chart .bar .bv{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--txs);white-space:nowrap}
.bar-labels{display:flex;gap:3px;margin-top:4px}
.bar-labels span{flex:1;text-align:center;font-size:9px;color:var(--txs);font-weight:600}
.progress-bar{height:5px;background:var(--surf2);border-radius:3px;overflow:hidden;margin-top:5px}
.pb-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:3px;transition:width .5s ease}
.pb-fill.warn{background:linear-gradient(90deg,var(--warn),#ea580c)}
.pb-fill.crit{background:linear-gradient(90deg,var(--err),#b91c1c)}
.settings-section{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-lg);margin-bottom:var(--sp3);overflow:hidden}
.settings-sec-hd{padding:13px var(--sp3);background:linear-gradient(135deg,var(--pris),transparent);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.settings-sec-hd svg{width:15px;height:15px;color:var(--pri)}
.settings-sec-hd span{font-size:13px;font-weight:700}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px var(--sp3);border-bottom:1px solid var(--bd);gap:11px}
.settings-row:last-child{border-bottom:none}
.sr-info{flex:1;min-width:0}
.sr-lbl{font-size:13px;font-weight:600}
.sr-sub{font-size:11px;color:var(--txs);margin-top:1px}
.sr-ctrl{flex-shrink:0;display:flex;align-items:center;gap:7px}
.settings-input{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--surf2);font-size:14px;font-weight:700;width:130px;transition:var(--tr)}
.settings-input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pris);background:var(--surfs)}
.toggle{position:relative;width:42px;height:22px;border-radius:11px;background:var(--surf2);border:1px solid var(--bd);cursor:pointer;transition:var(--tr);flex-shrink:0}
.toggle.on{background:linear-gradient(135deg,var(--pri),var(--acc));border-color:var(--pri)}
.toggle .knob{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:var(--tr);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .knob{right:22px}
.storage-bar{height:10px;background:var(--surf2);border-radius:5px;overflow:hidden;margin:10px 0}
.storage-bar .sb-fill{height:100%;border-radius:5px;transition:width .5s ease}
.sb-ok{background:linear-gradient(90deg,var(--ok),#0891b2)}
.sb-warn{background:linear-gradient(90deg,var(--warn),#ea580c)}
.sb-crit{background:linear-gradient(90deg,var(--err),#b91c1c)}
.dp-wrap{position:relative}
.dp-btn{width:100%;padding:9px 36px 9px 12px;background:var(--surf2);border:1px solid var(--bd);border-radius:9px;cursor:pointer;transition:var(--tr);font-size:14px;text-align:right;color:var(--tx);user-select:none;min-height:38px;line-height:1.5;display:block}
.dp-btn:hover,.dp-btn:focus{border-color:var(--pri);outline:none}
.dp-btn.empty{color:var(--txs)}
.dp-btn-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txs);pointer-events:none}
.dp-clr{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;display:none;place-items:center;color:var(--txs);background:var(--surf2);transition:var(--tr)}
.dp-clr svg{width:11px;height:11px}
.dp-clr:hover{color:var(--err);background:var(--errs)}
.dp-wrap.hv .dp-clr{display:grid}
.dp-wrap.hv .dp-btn-ico{display:none}
.dp-popup{position:fixed;z-index:260;background:var(--surfs);border:1px solid var(--bds);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:295px;padding:13px;direction:rtl}
.dp-hdr{display:flex;align-items:center;gap:6px;margin-bottom:11px}
.dp-nav{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surf2);color:var(--txm);transition:var(--tr)}
.dp-nav:hover{background:var(--pri);color:#fff}
.dp-nav svg{width:13px;height:13px}
.dp-month-title{flex:1;text-align:center;font-weight:700;font-size:13px}
.dp-wds{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dp-wds span{text-align:center;font-size:10px;font-weight:700;color:var(--txs);padding:2px 0}
.dp-wds .fri{color:var(--err)}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day{aspect-ratio:1;display:grid;place-items:center;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr);border:1px solid transparent}
.dp-day:hover{background:var(--pris);color:var(--pri);transform:scale(1.06)}
.dp-day.td{border-color:var(--pri);color:var(--pri)}
.dp-day.sel{background:var(--pri);color:#fff}
.dp-day.fri{color:var(--err)}
.dp-day.out{opacity:.25}
.dp-footer{display:flex;gap:6px;margin-top:11px;padding-top:9px;border-top:1px solid var(--bd)}
.dp-footer button{flex:1;padding:6px;border-radius:7px;font-size:11px;font-weight:700;background:var(--surf2);border:1px solid var(--bd);transition:var(--tr)}
.dp-footer button:hover{border-color:var(--pri);color:var(--pri)}
.dp-today-btn{background:var(--pris);color:var(--pri);border-color:transparent}
.dp-today-btn:hover{background:var(--pri);color:#fff}
.dp-back{position:fixed;inset:0;z-index:250}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:16px;font-size:12px;font-weight:600;background:var(--surf2);border:1px solid var(--bd);transition:var(--tr);cursor:pointer}
.fchip.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.fchip:hover{border-color:var(--pri)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.reminder-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:9px;background:var(--surf2);border:1px solid var(--bd);margin-bottom:6px;transition:var(--tr)}
.reminder-item:hover{border-color:var(--pri)}
.reminder-item.done{opacity:.5}
.reminder-item.done .ri-title{text-decoration:line-through}
.ri-chk{width:19px;height:19px;border-radius:50%;border:2px solid var(--bds);display:grid;place-items:center;cursor:pointer;transition:var(--tr);flex-shrink:0;margin-top:2px}
.ri-chk:hover{border-color:var(--pri)}
.done .ri-chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ri-chk svg{width:11px;height:11px}
.ri-body{flex:1;min-width:0}
.ri-title{font-size:13px;font-weight:600}

var Fmt=(function(){
  function money(n){try{return Number(Math.round(n||0)).toLocaleString('en-US');}catch(e){return String(Math.round(n||0));}}
  function hours(n){return Number(n||0).toFixed(1);}
  function pct(n){return Number(n||0).toFixed(1)+'%';}
  function shortDate(s){var p=Jalali.parse(s);return p?p[1]+'/'+p[2]:s||'—';}
  function fullDate(s){var p=Jalali.parse(s);return p?Jalali.fmt(p[0],p[1],p[2]):s||'—';}
  function weekdayOf(s){var p=Jalali.parse(s);return p?Jalali.WDSF[Jalali.weekday(p[0],p[1],p[2])]:'—';}
  function fileSize(b){b=b||0;if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(2)+' MB';}
  function to24h(t){if(!t)return'';var m=t.match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);if(!m)return t;var h=parseInt(m[1],10),mn=m[2],ap=(m[3]||'').toLowerCase();if(ap==='pm'&&h!==12)h+=12;if(ap==='am'&&h===12)h=0;return String(h).padStart(2,'0')+':'+mn;}
  function isoToJalali(iso){if(!iso)return'—';try{var d=new Date(iso),j=Jalali.toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());return Jalali.fmt(j[0],j[1],j[2]);}catch(e){return'—';}}
  function isoToJalaliTime(iso){if(!iso)return'—';try{var d=new Date(iso),j=Jalali.toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());return Jalali.fmt(j[0],j[1],j[2])+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}catch(e){return'—';}}
  return{money:money,hours:hours,pct:pct,shortDate:shortDate,fullDate:fullDate,weekdayOf:weekdayOf,fileSize:fileSize,to24h:to24h,isoToJalali:isoToJalali,isoToJalaliTime:isoToJalaliTime};
})();
</script>
<script>
var LS={
  get:function(k,def){try{var v=localStorage.getItem(k);return v===null?def:v;}catch(e){return def;}},
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){console.warn('LS.set failed',k,e);}},
  del:function(k){try{localStorage.removeItem(k);}catch(e){}},
  getJ:function(k,def){try{var v=localStorage.getItem(k);if(v===null)return def;return JSON.parse(v);}catch(e){return def;}},
  setJ:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn('LS.setJ failed',k,e);}},
  keys:function(){var r=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k)r.push(k);}}catch(e){}return r;}
};
</script>
<script>
var Store=(function(){
  var G='workapp-';
  var VER=9;
  var MKEY='workapp-migrated-v7';

  function _activeUser(){
    try{
      if(typeof AdminSession!=='undefined'&&AdminSession.isActive()){var iu=AdminSession.getImpUser();if(iu&&iu.username)return iu.username;}
      if(typeof Auth!=='undefined'&&Auth.getUser()&&Auth.getUser().username)return Auth.getUser().username;
    }catch(e){}
    return null;
  }
  function userPfx(u){var name=u||_activeUser();return name?G+'u-'+name+'-':G;}
  function mkey(y,mi,u){return userPfx(u)+y+'-'+Jalali.MONTHS[mi].en.toLowerCase();}
  function blank(){return{hours:[],websiteSales:[],storeSales:[],expenses:[],deductions:[],leaves:[],benefits:[]};}
  function loadMonth(y,mi,u){
    try{
      var r=LS.get(mkey(y,mi,u),null);
      if(!r)return blank();
      var d=Object.assign(blank(),JSON.parse(r));
      if(d.sales&&d.sales.length&&(!d.storeSales||!d.storeSales.length)){d.storeSales=d.sales.map(function(s){return Object.assign({},s,{channel:'store'});});delete d.sales;}
      (d.hours||[]).forEach(function(h){h.startTime=Fmt.to24h(h.startTime);h.endTime=Fmt.to24h(h.endTime);});
      return d;
    }catch(e){return blank();}
  }
  function saveMonth(y,mi,d,u){try{LS.setJ(mkey(y,mi,u),d);return true;}catch(e){return false;}}
  function deleteMonth(y,mi,u){LS.del(mkey(y,mi,u));}
  function settingsKey(u){return userPfx(u)+'settings';}
  function loadSettings(u){
    var raw=LS.getJ(settingsKey(u),{});
    var s=Object.assign({fixedSalary:6000000,hourlyRate:30000,darkTheme:false},raw);
    if(!s.commissionTiers||!Array.isArray(s.commissionTiers)){
      s.commissionTiers=[];
      if(s.commissionPct!=null&&!isNaN(s.commissionPct)&&s.commissionPct>0){
        s.commissionTiers.push({minSales:0,maxSales:null,pct:parseFloat(s.commissionPct)});
      }
    }else{
      // Preserve the old threshold behavior: each legacy tier ends just before the next minimum.
      var legacy=s.commissionTiers.slice().sort(function(a,b){return Number(a.minSales)-Number(b.minSales);});
      legacy.forEach(function(t,i){
        if(!Object.prototype.hasOwnProperty.call(t,'maxSales'))t.maxSales=i<legacy.length-1?Number(legacy[i+1].minSales)-1:null;
      });
      s.commissionTiers=legacy;
    }
    return s;
  }
  function saveSettings(s,u){LS.setJ(settingsKey(u),s);}
  function getTheme(u){return LS.get(userPfx(u)+'theme',LS.get(G+'theme','light'));}
  function setTheme(t,u){LS.set(userPfx(u||_activeUser()||'')+'theme',t);}
  function loadAux(name,u){return LS.getJ(userPfx(u)+name,[]);}
  function saveAux(name,data,u){LS.setJ(userPfx(u)+name,data);}
  function auxKey(name,u){return userPfx(u)+name;}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function storageSize(){var b=0;LS.keys().forEach(function(k){b+=(k.length+(LS.get(k,'')).length)*2;});return b;}
  function userStorageSize(username){var pfx=userPfx(username),b=0;LS.keys().forEach(function(k){if(k.startsWith(pfx))b+=(k.length+(LS.get(k,'')).length)*2;});return b;}
  function deleteUserData(username){var pfx=userPfx(username),cnt=0;LS.keys().filter(function(k){return k.startsWith(pfx);}).forEach(function(k){LS.del(k);cnt++;});return cnt;}
  function exportAll(){
    var users=[];try{if(typeof Auth!=='undefined')users=Auth.getUsers();}catch(e){}
    var out={_app:'workapp',_version:VER,exportedAt:new Date().toISOString(),users:{}};
    users.forEach(function(u){
      var pfx=G+'u-'+u.username+'-',uData={};
      LS.keys().forEach(function(k){if(k.startsWith(pfx))uData[k]=LS.get(k,'');});
      out.users[u.username]=uData;
    });
    return out;
  }
  function importAll(json){
    var d;try{d=typeof json==='string'?JSON.parse(json):json;}catch(e){throw new Error('JSON_PARSE_ERROR');}
    if(!d)throw new Error('VALIDATION_ERROR');
    var cnt=0;
    if(d.users){for(var uname in d.users){var uData=d.users[uname];for(var k in uData){LS.set(k,typeof uData[k]==='string'?uData[k]:JSON.stringify(uData[k]));cnt++;}}}
    else if(d.months){for(var k2 in d.months){LS.set(k2,typeof d.months[k2]==='string'?d.months[k2]:JSON.stringify(d.months[k2]));cnt++;}}
    return{items:cnt};
  }
  function migrateToUserNamespace(adminUsername){
    var moved=0,pfx=G+'u-'+adminUsername+'-';
    try{LS.del(pfx+'ideas');LS.del(pfx+'articles');LS.del('workapp-ideas');LS.del('workapp-articles');}catch(e){}
    if(LS.get(MKEY,null))return 0;
    try{
      var legacy=LS.keys().filter(function(k){return /^workapp-\d{4}-/.test(k)&&k.indexOf('-u-')<0;});
      legacy.forEach(function(k){var nk=pfx+k.replace('workapp-','');if(!LS.get(nk,null))LS.set(nk,LS.get(k,''));LS.del(k);moved++;});
      ['reminders','goals','achievements'].forEach(function(name){var old=LS.get('workapp-'+name,null);if(old){var nk=pfx+name;if(!LS.get(nk,null))LS.set(nk,old);LS.del('workapp-'+name);moved++;}});
      var os=LS.get('workapp-settings',null);if(os){var sk=pfx+'settings';if(!LS.get(sk,null))LS.set(sk,os);LS.del('workapp-settings');moved++;}
    }catch(e){console.warn('Migration error',e);}
    try{LS.del(pfx+'ideas');LS.del(pfx+'articles');LS.del('workapp-ideas');LS.del('workapp-articles');}catch(e){}
    LS.set(MKEY,'1');
    return moved;
  }
  return{userPfx:userPfx,mkey:mkey,blank:blank,loadMonth:loadMonth,saveMonth:saveMonth,deleteMonth:deleteMonth,
    settingsKey:settingsKey,loadSettings:loadSettings,saveSettings:saveSettings,
    getTheme:getTheme,setTheme:setTheme,
    loadAux:loadAux,saveAux:saveAux,auxKey:auxKey,
    uid:uid,storageSize:storageSize,userStorageSize:userStorageSize,deleteUserData:deleteUserData,
    exportAll:exportAll,importAll:importAll,migrateToUserNamespace:migrateToUserNamespace,
    G:G,VER:VER};
})();
</script>
<script>
var Auth=(function(){
  var AKEY='workapp-auth';
  var UKEY='workapp-users';
  var SKEY='workapp-super';
  var _cur=null;
  function init(){
    try{var s=sessionStorage.getItem(AKEY);if(s)_cur=JSON.parse(s);}
    catch(e){_cur=null;}
  }
  function isLoggedIn(){return!!_cur;}
  function getUser(){return _cur;}
  function getUsers(){return LS.getJ(UKEY,[]);}
  function saveUsers(u){LS.setJ(UKEY,u);}
  function getSuperUsername(){return LS.get(SKEY,null);}
  function isSuperAdmin(username){var u=username||(_cur&&_cur.username);return!!u&&getSuperUsername()===u;}
  function isAdmin(){return!!_cur&&(_cur.role==='admin'||_cur.role==='superadmin'||isSuperAdmin(_cur.username));}
  function pendingCount(){try{return getUsers().filter(function(u){return u.approval==='pending';}).length;}catch(e){return 0;}}
  function login(username,password){
    try{
      var users=getUsers();
      var u=users.find(function(x){return x.username===username&&x.password===password;});
      if(!u)return{ok:false,reason:'wrong_credentials'};
      var isSuper=isSuperAdmin(username);
      if(!isSuper){
        if((u.status||'active')==='inactive')return{ok:false,reason:'inactive'};
        var approval=u.approval||'approved';
        if(approval==='pending')return{ok:false,reason:'pending'};
        if(approval==='rejected')return{ok:false,reason:'rejected'};
      }
      _cur={username:u.username,name:u.name||u.username,role:u.role||'user',isSuper:!!isSuper};
      try{sessionStorage.setItem(AKEY,JSON.stringify(_cur));}catch(e){}
      var idx=users.findIndex(function(x){return x.username===username;});
      if(idx>=0){users[idx].lastLogin=new Date().toISOString();saveUsers(users);}
      return{ok:true};
    }catch(e){console.error('login error',e);return{ok:false,reason:'error'};}
  }
  function logout(){_cur=null;try{sessionStorage.removeItem(AKEY);}catch(e){}}
  function isFirstTime(){return getUsers().length===0;}
  function register(username,password,name){
    try{
      var users=getUsers();
      if(users.find(function(u){return u.username===username;}))return{ok:false,reason:'exists'};
      if(users.length>0)return{ok:false,reason:'not_first'};
      users.push({username:username,password:password,name:name||username,role:'superadmin',status:'active',approval:'approved',permissions:[],isSuper:true,createdAt:new Date().toISOString()});
      saveUsers(users);
      LS.set(SKEY,username);
      _cur={username:username,name:name||username,role:'superadmin',isSuper:true};
      try{sessionStorage.setItem(AKEY,JSON.stringify(_cur));}catch(e){}
      setTimeout(function(){try{if(typeof Workspaces!=='undefined')Workspaces.ensureDefault(username);}catch(e){}},0);
      return{ok:true,isFirst:true};
    }catch(e){console.error('register error',e);return{ok:false,reason:'error'};}
  }
  function signUp(username,password,name){
    try{
      var users=getUsers();
      if(users.find(function(u){return u.username===username;}))return{ok:false,reason:'exists'};
      users.push({username:username,password:password,name:name||username,role:'employee',status:'pending',approval:'pending',permissions:[],createdAt:new Date().toISOString()});
      saveUsers(users);
      return{ok:true};
    }catch(e){return{ok:false,reason:'error'};}
  }
  function approveUser(username){
    try{
      var users=getUsers(),i=users.findIndex(function(u){return u.username===username;});
      if(i<0)return false;
      users[i].approval='approved';users[i].status='active';
      if(!users[i].role||users[i].role==='employee')users[i].role='user';
      saveUsers(users);
      try{if(typeof Workspaces!=='undefined')Workspaces.ensureDefault(username);}catch(e){}
      return true;
    }catch(e){return false;}
  }
  function rejectUser(username,del){
    try{
      var users=getUsers(),i=users.findIndex(function(u){return u.username===username;});
      if(i<0)return false;
      if(del){users.splice(i,1);}else{users[i].approval='rejected';users[i].status='inactive';}
      saveUsers(users);return true;
    }catch(e){return false;}
  }
  function setUserStatus(username,status){
    if(isSuperAdmin(username)&&status==='inactive')return false;
    try{var users=getUsers(),i=users.findIndex(function(u){return u.username===username;});if(i<0)return false;users[i].status=status;saveUsers(users);return true;}catch(e){return false;}
  }
  function updateUser(username,patch){
    try{var users=getUsers(),i=users.findIndex(function(u){return u.username===username;});if(i<0)return false;if(isSuperAdmin(username)){delete patch.role;delete patch.status;}users[i]=Object.assign({},users[i],patch);saveUsers(users);return true;}catch(e){return false;}
  }
  function addUser(data){
    try{var users=getUsers();if(users.find(function(u){return u.username===data.username;}))return false;users.push(Object.assign({role:'user',status:'active',approval:'approved',permissions:[],createdAt:new Date().toISOString()},data));saveUsers(users);return true;}catch(e){return false;}
  }
  function deleteUser(username){
    if(isSuperAdmin(username))return false;
    try{saveUsers(getUsers().filter(function(u){return u.username!==username;}));Store.deleteUserData(username);return true;}catch(e){return false;}
  }

<script>
var CommissionTiers=(function(){
  function normalize(tiers){
    if(!Array.isArray(tiers))return[];
    var sorted=tiers.map(function(t){
      return{minSales:Math.max(0,Number(t.minSales)||0),maxSales:(t.maxSales==null||t.maxSales==='')?null:Math.max(0,Number(t.maxSales)||0),pct:Math.max(0,Number(t.pct)||0)};
    }).filter(function(t){return t.pct>0;}).sort(function(a,b){return a.minSales-b.minSales;});
    return sorted;
  }
  function validate(tiers){
    var errs=[];
    if(!Array.isArray(tiers))return['invalid'];
    var sorted=tiers.slice().sort(function(a,b){return a.minSales-b.minSales;});
    for(var i=0;i<sorted.length;i++){
      var t=sorted[i],max=t.maxSales==null||t.maxSales===''?null:Number(t.maxSales);
      if(!Number.isFinite(Number(t.minSales))||t.minSales<0)errs.push('حداقل فروش معتبر نیست');
      if(max!=null&&(!Number.isFinite(max)||max<=t.minSales))errs.push('حداکثر فروش باید بیشتر از حداقل فروش باشد');
      if(!Number.isFinite(Number(t.pct))||t.pct<=0)errs.push('درصد پورسانت باید بزرگتر از ۰ باشد');
      if(i>0){
        var prev=sorted[i-1],prevMax=prev.maxSales==null||prev.maxSales===''?null:Number(prev.maxSales);
        if(prevMax==null||t.minSales<=prevMax)errs.push('بازه‌های فروش نباید هم‌پوشانی داشته باشند');
      }
    }
    return errs;
  }
  function getCommissionPct(totalSales,tiers){
    var sorted=normalize(tiers);
    for(var i=0;i<sorted.length;i++){
      var t=sorted[i];
      if(totalSales>=t.minSales&&(t.maxSales==null||totalSales<=t.maxSales))return t.pct;
    }
    return 0;
  }
  return{normalize:normalize,validate:validate,getCommissionPct:getCommissionPct};
})();

var Payroll=(function(){
  function timeDiff(s,e){if(!s||!e)return 0;var sa=s.split(':').map(Number),ea=e.split(':').map(Number);var diff=(ea[0]*60+ea[1])-(sa[0]*60+sa[1]);if(diff<0)diff+=1440;return Math.max(0,diff/60);}
  function compute(month,settings){
    try{
      var cfg=settings||Store.loadSettings();
      var totalHours=(month.hours||[]).reduce(function(s,h){return s+(h.hours||0);},0);
      var websiteSales=(month.websiteSales||[]).reduce(function(s,r){return s+(r.amount||0);},0);
      var storeSales=(month.storeSales||[]).reduce(function(s,r){return s+(r.amount||0);},0);
      var totalSales=websiteSales+storeSales;
      var totalExpenses=(month.expenses||[]).reduce(function(s,r){return s+(r.amount||0);},0);
      var totalDeductions=(month.deductions||[]).reduce(function(s,r){return s+(r.amount||0);},0);
      var totalBenefits=(month.benefits||[]).reduce(function(s,r){return s+(r.amount||0);},0);
      var hourlyRate=month.hourlyRate!=null?month.hourlyRate:cfg.hourlyRate;
      var fixedSalary=month.fixedSalary!=null?month.fixedSalary:cfg.fixedSalary;
      var commissionPct;
      if(month.commissionPct!=null){
        commissionPct=month.commissionPct;
      }else{
        var tiers=cfg.commissionTiers||[];
        commissionPct=CommissionTiers.getCommissionPct(totalSales,tiers);
      }
      var commission=totalSales*commissionPct/100;
      var hourlySalary=totalHours*hourlyRate;
      var grossSalary=fixedSalary+commission+hourlySalary+totalBenefits+totalExpenses;
      var netSalary=grossSalary-totalDeductions;
      var workDays=new Set((month.hours||[]).map(function(h){return h.date;})).size;
      var leaves=month.leaves||[];
      return{totalHours:totalHours,websiteSales:websiteSales,storeSales:storeSales,totalSales:totalSales,totalExpenses:totalExpenses,totalDeductions:totalDeductions,totalBenefits:totalBenefits,commission:commission,hourlySalary:hourlySalary,grossSalary:grossSalary,netSalary:netSalary,workDays:workDays,fullLeaveCount:leaves.filter(function(l){return l.type==='full';}).length,storeClosedCount:leaves.filter(function(l){return l.type==='store_closed';}).length,hourlyLeaveCount:leaves.filter(function(l){return l.type==='hourly';}).length,totalLeaveCount:leaves.length,fixedSalary:fixedSalary,hourlyRate:hourlyRate,commissionPct:commissionPct};
    }catch(e){return{totalHours:0,websiteSales:0,storeSales:0,totalSales:0,totalExpenses:0,totalDeductions:0,totalBenefits:0,commission:0,hourlySalary:0,grossSalary:0,netSalary:0,workDays:0,fullLeaveCount:0,storeClosedCount:0,hourlyLeaveCount:0,totalLeaveCount:0,fixedSalary:0,hourlyRate:0,commissionPct:0};}
  }
  function missingDays(month,year,mi){
    try{
      var leaves=month.leaves||[];
      var covered=new Set(leaves.filter(function(l){return l.type==='full'||l.type==='store_closed';}).map(function(l){return l.date;}));
      var worked=new Set((month.hours||[]).map(function(h){return h.date;}));
      var missing=[],dim=Jalali.daysInMonth(year,mi+1);
      var today=Jalali.today(),tn=today[0]*10000+today[1]*100+today[2];
      for(var d=1;d<=dim;d++){
        var wd=Jalali.weekday(year,mi+1,d);if(wd===6)continue;
        var ds=Jalali.fmt(year,mi+1,d);
        if(covered.has(ds)||worked.has(ds))continue;
        var cn=year*10000+(mi+1)*100+d;if(cn>=tn)continue;
        missing.push({date:ds,day:d,weekday:wd});
      }
      return missing;
    }catch(e){return[];}
  }
  function dayEvents(month,dateStr){
    var ev={hours:0,websiteSales:0,storeSales:0,expenses:0,fullLeave:false,hourlyLeave:null,storeClosed:false};
    try{
      (month.hours||[]).forEach(function(h){if(h.date===dateStr)ev.hours+=h.hours||0;});
      (month.websiteSales||[]).forEach(function(s){if(s.date===dateStr)ev.websiteSales+=s.amount||0;});
      (month.storeSales||[]).forEach(function(s){if(s.date===dateStr)ev.storeSales+=s.amount||0;});
      (month.expenses||[]).forEach(function(e){if(e.date===dateStr)ev.expenses+=e.amount||0;});
      (month.leaves||[]).forEach(function(l){if(l.date!==dateStr)return;if(l.type==='full')ev.fullLeave=true;else if(l.type==='hourly')ev.hourlyLeave=l;else if(l.type==='store_closed')ev.storeClosed=true;});
    }catch(e){}
    return ev;
  }
  return{timeDiff:timeDiff,compute:compute,missingDays:missingDays,dayEvents:dayEvents};
})();

var Records=(function(){
  function getAll(username){
    var out=[],pfx=Store.userPfx(username);
    LS.keys().forEach(function(k){
      if(!k.startsWith(pfx))return;
      var suffix=k.slice(pfx.length);
      if(!/^\d{4}-/.test(suffix))return;
      try{
        var d=JSON.parse(LS.get(k,'{}'));
        var parts=suffix.split('-'),year=parseInt(parts[0],10),en=parts.slice(1).join('-');
        var mi=Jalali.MONTHS.findIndex(function(m){return m.en.toLowerCase()===en;});
        if(mi>=0&&year>1300){var s=Payroll.compute(d);out.push({key:k,year:year,mi:mi,monthName:Jalali.MONTHS[mi].fa,stats:s,data:d});}
      }catch(e){}
    });
    return out.sort(function(a,b){return b.year-a.year||b.mi-a.mi;});
  }
  function totals(u){return getAll(u).reduce(function(a,r){return{hours:a.hours+r.stats.totalHours,sales:a.sales+r.stats.totalSales,commission:a.commission+r.stats.commission,months:a.months+1};},{hours:0,sales:0,commission:0,months:0});}
  function best(fn,u){var a=getAll(u);return a.length?a.reduce(function(b,r){return fn(r)>fn(b)?r:b;}):null;}
  return{getAll:getAll,totals:totals,best:best};
})();

var Analytics=(function(){
  function bestDayAnalysis(month){var byDay={};(month.hours||[]).forEach(function(h){var p=Jalali.parse(h.date);if(!p)return;var wd=Jalali.weekday(p[0],p[1],p[2]);byDay[wd]=(byDay[wd]||0)+(h.hours||0);});return{byDay:byDay};}
  function predict(month,dayOfMonth){var s=Payroll.compute(month);if(!dayOfMonth||dayOfMonth<=0)return{projectedHours:0,projectedSales:0,confidence:0};var t=Jalali.today(),dim=Jalali.daysInMonth(t[0],t[1]),r=dim/dayOfMonth;return{projectedHours:Math.round(s.totalHours*r),projectedSales:Math.round(s.totalSales*r),confidence:Math.min(95,Math.round(dayOfMonth/dim*100))};}
  return{bestDayAnalysis:bestDayAnalysis,predict:predict};
})();
</script>

      var ctx={hasNoMissing:all.some(function(r){return Payroll.missingDays(r.data,r.year,r.mi).length===0&&r.stats.workDays>0;}),hasCompletedGoal:goals.some(function(g){return g.status==='completed';})};
      var newOnes=[];
      DEFS.forEach(function(def){if(unlocked.indexOf(def.id)<0&&def.check(all,ctx)){unlocked.push(def.id);newOnes.push(def);}});
      if(newOnes.length)LS.setJ(Store.auxKey(N,u),unlocked);
      return{unlocked:unlocked,newOnes:newOnes,defs:DEFS};
    }catch(e){return{unlocked:[],newOnes:[],defs:DEFS};}
  }
  function getProgress(u){
    try{
      var all=Records.getAll(u),goals=Goals.load(u);
      var ctx={hasNoMissing:all.some(function(r){return Payroll.missingDays(r.data,r.year,r.mi).length===0&&r.stats.workDays>0;}),hasCompletedGoal:goals.some(function(g){return g.status==='completed';})};
      var unlocked=getUnlocked(u);
      return DEFS.map(function(def){return Object.assign({},def,{unlocked:unlocked.indexOf(def.id)>=0||def.check(all,ctx)});});
    }catch(e){return DEFS.map(function(def){return Object.assign({},def,{unlocked:false});});}
  }
  return{DEFS:DEFS,checkAll:checkAll,getProgress:getProgress,getUnlocked:getUnlocked};
})();
</script>

<script>
function startAuthParticles(){
  var canvas=document.getElementById('auth-particles');
  if(!canvas)return;
  try{
    var ctx=canvas.getContext('2d');if(!ctx)return;
    var W=window.innerWidth,H=window.innerHeight;
    canvas.width=W;canvas.height=H;
    canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
    var pts=[];
    for(var i=0;i<50;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,vx:(Math.random()-.5)*.3,vy:-(Math.random()*.38+.08),op:Math.random()*.38+.1});
    var raf=null;
    function draw(){
      ctx.clearRect(0,0,W,H);
      pts.forEach(function(p){
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle='rgba(165,180,252,'+p.op+')';ctx.fill();
        p.x+=p.vx;p.y+=p.vy;
        if(p.y<-5)p.y=H+5;if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
      });
      raf=requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener('resize',function(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;},{passive:true,once:false});
  }catch(e){}
}

    if(shown){splash.style.display='none';onDone();return;}

<script>
